<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fastest Lab · the AI model grand prix</title>
<meta name="description" content="Who has the best AI model lineup right now? The labs as race cars, the gaps as the message. One opinion, zero benchmarks.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M11 24 14 8h10M12.5 16h8' stroke='%23b65cff' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --ink: #f4f5f7;
    --mute: #98a0aa;
    --purple: #b65cff;   /* timing-screen purple: fastest of all */
    --green: #2ee57a;    /* timing-screen green */
    --yellow: #ffd23f;
    --font: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { touch-action: manipulation; }
  #track { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- wordmark ---------- */
  #brand { position: fixed; z-index: 5; left: max(16px, 2.5vw); top: max(14px, 2.4vh); }
  #brand h1 { margin: 0; font: italic 800 clamp(34px, 4.3vw, 58px)/.86 var(--font); letter-spacing: .005em; text-transform: uppercase; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  #brand h1 em { font-style: inherit; color: var(--purple); }
  #brand .sectors { display: flex; gap: 4px; margin: 9px 0 8px 2px; }
  #brand .sectors i { width: 30px; height: 4px; transform: skewX(-24deg); background: var(--purple); }
  #brand .sectors i:nth-child(2) { background: var(--green); }
  #brand .sectors i:nth-child(3) { background: var(--yellow); }
  #brand p { margin: 0; font: 600 clamp(11px, 1vw, 14px)/1.2 var(--font); letter-spacing: .17em; text-transform: uppercase; color: var(--mute); }

  /* ---------- date stamp + start lights ---------- */
  #stamp { position: fixed; z-index: 5; right: max(16px, 2.5vw); top: max(16px, 2.6vh); text-align: right; }
  #stamp .lights { display: inline-flex; gap: 5px; padding: 5px 7px; border-radius: 9px; background: rgba(5,6,8,.8); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  #stamp .lights i { width: 10px; height: 10px; border-radius: 50%; background: #2a1214; transition: background .08s, box-shadow .08s; }
  #stamp .lights i.on { background: #ff2a1f; box-shadow: 0 0 10px 2px rgba(255,42,31,.75); }
  #stamp .date { margin-top: 8px; font: italic 700 clamp(22px, 2.5vw, 34px)/1 var(--font); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
  #stamp .headline { margin-top: 5px; font: 600 clamp(11px, 1vw, 14px)/1.2 var(--font); letter-spacing: .15em; text-transform: uppercase; color: var(--mute); transition: opacity .25s; }
  #stamp .demo[hidden] { display: none; }
  #stamp .demo { display: inline-block; margin-top: 6px; font: 600 10px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--yellow); border: 1px solid rgba(255,210,63,.45); border-radius: 3px; padding: 3px 5px 2px; transition: opacity .25s; }

  /* ---------- car labels ---------- */
  #labels { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; width: var(--lw); padding: 8px 0 6px 12px; opacity: 0; will-change: transform, opacity;
    background: linear-gradient(90deg, rgba(7,9,11,.8), rgba(7,9,11,.45) 55%, rgba(7,9,11,0));
    border-top: 2px solid; border-image: linear-gradient(90deg, var(--tint), transparent 94%) 1; }
  .label.left { padding: 8px 12px 6px 0; text-align: right;
    background: linear-gradient(270deg, rgba(7,9,11,.8), rgba(7,9,11,.45) 55%, rgba(7,9,11,0));
    border-image: linear-gradient(270deg, var(--tint), transparent 94%) 1; }
  .r1 { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .r2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; font: 600 17px/1 var(--font); letter-spacing: .04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .left .r1, .left .r2 { flex-direction: row-reverse; }
  .pos { font: italic 800 34px/1 var(--font); color: var(--tint); }
  .badge { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--bbg); display: grid; place-items: center; box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); }
  .badge svg { display: block; width: calc(var(--ls, .7) * 100%); height: calc(var(--ls, .7) * 100%); }
  .name { font: italic 700 28px/1 var(--font); text-transform: uppercase; letter-spacing: .01em; }
  .int { color: var(--mute); font-size: 13px; letter-spacing: .1em; }
  .chip { display: none; font: 700 11px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; padding: 3px 6px 2px; border-radius: 3px; }
  .chip.on { display: inline-block; }
  .chip.drs { background: var(--green); color: #03140a; }
  .chip.fl { background: var(--purple); color: #fff; }
  .r3 { margin-top: 7px; font: 400 13px/1.3 var(--body); color: #c9ced5; }
  .r3 b { font: 600 12px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .r3 b::after { content: ' / '; opacity: .5; }

  /* ---------- timeline ---------- */
  #deck { position: fixed; z-index: 5; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(580px, calc(100% - 28px)); display: flex; gap: 16px; align-items: flex-start; padding-right: 26px;
    opacity: 0; transition: opacity .6s; }
  body.live #deck { opacity: 1; }
  #play { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.24); background: rgba(12,14,18,.72); color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: border-color .15s, background .15s; }
  #play:hover { border-color: var(--purple); background: rgba(182,92,255,.18); }
  #play svg { width: 14px; height: 14px; fill: currentColor; }
  #play .pause { display: none; }
  #play.playing .pause { display: block; }
  #play.playing .go { display: none; }
  #tl { position: relative; flex: 1; height: 62px; }
  #tl .rail { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.17); }
  #tl .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, rgba(182,92,255,.15), var(--purple)); }
  #tl .tk { position: absolute; top: 9px; width: 2px; height: 22px; margin-left: -1px; background: rgba(255,255,255,.4); }
  #tl .tick { position: absolute; top: 35px; transform: translateX(-50%); background: none; border: 0; padding: 4px 8px 6px; color: var(--mute); font: 600 13px/1 var(--font); letter-spacing: .15em; white-space: nowrap; cursor: pointer; z-index: 5; transition: color .15s; }
  #tl .tick:hover, #tl .tick.on { color: #fff; }
  #tl .tick:focus-visible, #play:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  #tl .knob { position: absolute; top: 20px; left: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(182,92,255,.4), 0 2px 12px rgba(0,0,0,.7); pointer-events: none; z-index: 2; }
  #scrub { position: absolute; left: -12px; top: 3px; width: calc(100% + 24px); height: 34px; margin: 0; opacity: 0; cursor: grab; z-index: 4; }
  #scrub:active { cursor: grabbing; }
  #scrub:focus-visible ~ .knob { box-shadow: 0 0 0 4px var(--purple), 0 0 0 7px rgba(255,255,255,.5); }
  #fine, #hint { position: fixed; z-index: 4; bottom: calc(20px + env(safe-area-inset-bottom)); margin: 0; font: 600 12px/1.3 var(--font); letter-spacing: .15em; text-transform: uppercase; color: var(--mute); opacity: .85; }
  #fine { left: max(16px, 2.5vw); }
  #hint { right: max(16px, 2.5vw); text-align: right; }
  #hint kbd { font: inherit; color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 1px 5px; }
  #hint { line-height: 2.05; bottom: calc(15px + env(safe-area-inset-bottom)); }

  /* ---------- car-style switch ---------- */
  #garage { display: inline-flex; align-items: center; gap: 1px; margin: 11px 0 0 -1px; padding: 2px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(12,14,18,.66); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; transition: opacity .6s; }
  body.live #garage { opacity: 1; }
  #garage span { padding: 1px 5px 0 9px; font: 600 11px/1 var(--font); letter-spacing: .17em; text-transform: uppercase; color: var(--mute); }
  #garage button { border: 0; background: none; color: var(--mute); cursor: pointer; padding: 6px 10px 5px; border-radius: 999px; font: 700 12px/1 var(--font); letter-spacing: .15em; text-indent: .15em; text-transform: uppercase; transition: color .15s, background .15s; }
  #garage button:hover { color: #fff; }
  #garage button[aria-pressed="true"] { color: #fff; background: rgba(182,92,255,.24); box-shadow: inset 0 0 0 1px rgba(182,92,255,.75); }
  #garage button:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }

  @media (max-width: 900px) { #fine, #hint { display: none; } }
  @media (max-width: 640px) {
    #brand .sectors { margin: 7px 0 6px 2px; }
    #brand .sectors i { width: 22px; height: 3px; }
    #brand p span { display: none; }
    #garage { margin-top: 6px; padding: 1px; }
    #garage span { display: none; }
    #garage button { padding: 5px 8px 4px; font-size: 11px; }
    #stamp .lights i { width: 8px; height: 8px; }
    #stamp .headline { max-width: 150px; margin-left: auto; }
    .label { padding: 6px 0 4px 8px; }
    .label.left { padding: 6px 8px 4px 0; }
    .r1 { flex-wrap: wrap; gap: 3px 6px; }
    .left .r1 { justify-content: flex-start; }
    .pos { font-size: 25px; }
    .badge { width: 19px; height: 19px; }
    .name { flex-basis: 100%; font-size: 19px; }
    .r2 { margin-top: 4px; font-size: 14px; gap: 6px; }
    .int, .r3, .lead .gap { display: none; }
    .chip { font-size: 10px; padding: 2px 4px 1px; }
    .chip.fl { letter-spacing: .08em; }
    #tl .tick { font-size: 12px; letter-spacing: .1em; }
  }
  @media (max-height: 560px) {
    #brand p, #stamp .headline, #stamp .lights, .r3, .int, #fine, #hint { display: none; }
    #brand h1 { font-size: 30px; }
    #garage { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); margin: 0; }
    #stamp .date { margin-top: 0; font-size: 22px; }
    .label, .label.left { padding-top: 5px; padding-bottom: 3px; }
    .pos { font-size: 22px; } .name { font-size: 18px; }
    .badge { width: 18px; height: 18px; }
    .r2 { margin-top: 3px; font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="track" aria-hidden="true"></canvas>
<div id="labels" aria-live="off"></div>

<header id="brand">
  <h1>Fastest <em>Lab</em></h1>
  <div class="sectors"><i></i><i></i><i></i></div>
  <p>The AI model grand prix<span> · gaps by vibes</span></p>
  <div id="garage" role="group" aria-label="Car style"><span aria-hidden="true">Cars</span></div>
</header>

<div id="stamp">
  <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="date"></div>
  <div class="headline"></div>
  <div class="demo" hidden>Illustrative snapshot</div>
</div>

<footer id="deck">
  <button id="play" aria-label="Replay the season">
    <svg class="go" viewBox="0 0 14 14"><path d="M3 1.2v11.6L13 7z"/></svg>
    <svg class="pause" viewBox="0 0 14 14"><path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/></svg>
  </button>
  <div id="tl">
    <div class="rail"><div class="fill"></div></div>
    <input id="scrub" type="range" min="0" max="1000" step="1" value="1000" aria-label="Timeline">
    <div class="knob"></div>
  </div>
</footer>
<p id="fine">One person's opinion.<br>Gaps are vibes, not benchmarks.</p>
<p id="hint"><kbd>←</kbd> <kbd>→</kbd> travel in time<br><kbd>C</kbd> change cars</p>

<script>
/* ════════════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════════════

   LABS       one entry per lab: name, sub-brand and livery colors.
              (The official logos live in LOGOS, just below this block.)

   SNAPSHOTS  a list of dated classifications. Each lists the labs in
              finishing order, P1 first. `gap` is the interval in seconds
              to the car directly AHEAD (the leader's gap is ignored).
              Bigger number = more empty road. Want Google closer to
              OpenAI? Shrink Google's gap. That's the whole interface.

              Add a snapshot and the timeline grows a new stop by itself;
              cars drive between snapshots. A lab missing from a snapshot
              simply starts (or ends) off the back of the screen.
   ════════════════════════════════════════════════════════════════════════ */

const LABS = {
  anthropic: { name: 'Anthropic', sub: 'Claude',            color: '#D9774F', accent: '#F6EDE0' },
  openai:    { name: 'OpenAI',    sub: 'GPT',               color: '#12A37F', accent: '#F2FFFA' },
  google:    { name: 'Google',    sub: 'Gemini · DeepMind', color: '#F3F5F9', accent: '#3B82F6',
               stripes: ['#4285F4', '#EA4335', '#FBBC05', '#34A853'] },
  meta:      { name: 'Meta',      sub: 'Muse',              color: '#0A6CFF', accent: '#EAF2FF' },
  spacexai:  { name: 'SpaceX AI', sub: 'Grok · ex-xAI',     color: '#14161B', accent: '#C3CAD3' },
};

const SNAPSHOTS = [
  { // demo: true = a placeholder guess so the timeline has somewhere to go. Retune or delete.
    date: '2025-11-20', headline: 'Three-way knife fight', demo: true,
    standings: [
      { lab: 'google',    gap: 0,    note: 'Gemini has the moment.' },
      { lab: 'anthropic', gap: 0.25, note: 'Tucked into the slipstream.' },
      { lab: 'openai',    gap: 0.45, note: 'Third, but only just.' },
      { lab: 'spacexai',  gap: 1.00, note: 'Quick in a straight line.', name: 'xAI', sub: 'Grok' },
      { lab: 'meta',      gap: 1.50, note: 'A very long pit stop.', sub: 'Llama' },

  {
    date: '2026-05-20', headline: 'Anthropic breaks the tow', demo: true,
    standings: [
      { lab: 'anthropic', gap: 0,    note: 'Out front and pulling away.' },
      { lab: 'openai',    gap: 0.55, note: 'Leading the chase.' },
      { lab: 'google',    gap: 0.35, note: 'Lost the lead, kept the pace.' },
      { lab: 'spacexai',  gap: 1.10, note: 'Holding fourth, for now.' },
      { lab: 'meta',      gap: 0.70, note: 'Muse is finding lap time.' },
    ],
  },
  { // ← the real one: the owner's take, November 2026
    date: '2026-11-20', headline: 'Clear air up front',
    standings: [
      { lab: 'anthropic', gap: 0,    note: 'Clear leader.' },
      { lab: 'openai',    gap: 1.00, note: 'Still second.' },                              // the noticeable gap

      { lab: 'spacexai',  gap: 0.30, note: 'Close behind Meta.' },                          // tight battle
    ],
  },
];

  google: { box: [1, 1, 22, 22], size: .64, bg: '#FFFFFF', paths: [
    ['#4285F4', 'M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z'],

      for (const sd of [-1, 1]) { ctx.fillStyle = '#23272e'; ctx.fillRect(cx + sd * (zo + 22 * S) - 30 * S, y - 40 * S, 60 * S, 80 * S); ctx.fillStyle = 'rgba(255,255,255,.07)'; for (let i = 0; i < 6; i++) ctx.fillRect(cx + sd * (zo + 22 * S) - 30 * S, y - 38 * S + i * 13 * S, 60 * S, 1.5); }
      const dg = ctx.createLinearGradient(0, y - h, 0, y + h); dg.addColorStop(0, '#272b33'); dg.addColorStop(1, '#191c22');
      ctx.fillStyle = dg; ctx.fillRect(0, y - h, W, h * 2);

      ctx.fillStyle = bg; ctx.fillRect(cx - bw, y - 15 * S, bw * 2, 30 * S);

/* ---------- intro: five lights, then away we go ---------- */
const lights = [...document.querySelectorAll('#stamp .lights i')];
function setLights(n) { if (intro.lit === n) return; intro.lit = n; lights.forEach((el, i) => el.classList.toggle('on', i < n)); }
const GO = 0.5 + 0.24 * 4 + 0.8;
function stepIntro(t) {
  if (intro.done) { intro.e = intro.speedF = intro.hud = 1; setLights(0); document.body.classList.add('live'); return; }
  if (intro.t0 == null) intro.t0 = t;
  const k = t - intro.t0;
  setLights(k < GO ? clamp(Math.floor((k - 0.5) / 0.24) + 1, 0, 5) : 0);
  const p = clamp((k - GO) / 3.0, 0, 1);
  intro.e = easeIO(p);
  intro.speedF = easeOut(clamp((k - GO) / 1.7, 0, 1));
  intro.hud = smooth(.5, .95, p);
  if (k > GO + 1.2) document.body.classList.add('live');
  if (p >= 1) intro.done = true;
}
function finishIntro() { intro.done = true; }

/* ---------- timeline ---------- */
const scrub = $('#scrub'), knob = $('#tl .knob'), fill = $('#tl .fill'), playBtn = $('#play');
const dateEl = $('#stamp .date'), headEl = $('#stamp .headline'), demoEl = $('#stamp .demo');
const ticks = snaps.map((s, i) => {
  const b = document.createElement('button');
  const d = new Date(s.time);
  b.className = 'tick'; b.type = 'button'; b.style.left = tPos[i] * 100 + '%';
  b.textContent = `${MONTHS[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`;
  const tk = document.createElement('i'); tk.className = 'tk'; tk.style.left = b.style.left; $('#tl').appendChild(tk);
  b.setAttribute('aria-label', `Go to ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`);
  b.addEventListener('click', () => goTo(i));
  $('#tl').appendChild(b);
  return b;
});
if (LAST < 1) { $('#deck').style.display = 'none'; $('#hint').style.display = 'none'; }

function animTo(to, dur, ease = easeIO) { tl.anim = { from: tl.idx, to, t0: performance.now(), dur, ease }; }
function goTo(i, dur) {
  finishIntro(); tl.queue = []; tl.playing = false;
  i = clamp(i, 0, LAST);
  animTo(i, dur ?? clamp(Math.abs(i - tl.idx) * 1500, 450, 3200));
}
function play() {
  finishIntro();
  if (tl.queue.length || (tl.anim && playBtn.classList.contains('playing'))) { tl.queue = []; tl.anim = null; goTo(Math.round(tl.idx), 400); return; }
  tl.queue = [];
  let from = Math.floor(tl.idx + 1e-6);
  if (tl.idx >= LAST - 1e-3) { tl.queue.push({ to: 0, dur: 1100 }, { wait: 650 }); from = 0; }
  for (let k = from + 1; k <= LAST; k++) { tl.queue.push({ to: k, dur: 2800 }); if (k < LAST) tl.queue.push({ wait: 800 }); }
  tl.playing = true;
}
function stepAnim(now) {
  if (!tl.anim && tl.queue.length) {
    const q = tl.queue.shift();
    if (q.wait) tl.anim = { from: tl.idx, to: tl.idx, t0: now, dur: q.wait, ease: x => x };
    else animTo(q.to, q.dur);
  }
  if (tl.anim) {
    const a = tl.anim, p = clamp((now - a.t0) / a.dur, 0, 1);
    tl.idx = lerp(a.from, a.to, a.ease(p));
    if (p >= 1) { tl.idx = a.to; tl.anim = null; }
  }
  if (!tl.anim && !tl.queue.length) tl.playing = false;
  playBtn.classList.toggle('playing', !!tl.playing);
}
scrub.addEventListener('input', () => { finishIntro(); tl.anim = null; tl.queue = []; tl.playing = false; tl.dragging = true; tl.idx = posToIdx(scrub.value / 1000); });
const release = () => { if (!tl.dragging) return; tl.dragging = false; animTo(Math.round(tl.idx), 420, easeOut); };
scrub.addEventListener('change', release);
scrub.addEventListener('pointerup', release);
scrub.addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) e.preventDefault(); });
playBtn.addEventListener('click', play);
addEventListener('keydown', e => {
  if (LAST < 1) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') goTo(Math.ceil(tl.idx - 1e-3) - 1);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') goTo(Math.floor(tl.idx + 1e-3) + 1);
  else if (e.key === ' ' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); play(); }
});

let uiCache = {};
function syncTimelineUI() {
  const pos = idxToPos(tl.idx), near = Math.round(tl.idx), dist = Math.abs(tl.idx - near);
  if (!tl.dragging) scrub.value = Math.round(pos * 1000);
  knob.style.left = fill.style.width = (pos * 100).toFixed(2) + '%';
  const i = clamp(Math.floor(tl.idx), 0, LAST), j = Math.min(i + 1, LAST);
  const d = new Date(lerp(snaps[i].time, snaps[j].time, tl.idx - i));
  const date = `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  if (uiCache.date !== date) dateEl.textContent = uiCache.date = date;
  if (uiCache.near !== near) {
    uiCache.near = near; L.lh = 0;
    headEl.textContent = snaps[near].headline || '';
    demoEl.hidden = !snaps[near].demo;
    ticks.forEach((b, k) => b.classList.toggle('on', k === near));
  }
  const o = (1 - smooth(.04, .2, dist)).toFixed(2);
  if (uiCache.o !== o) headEl.style.opacity = demoEl.style.opacity = uiCache.o = o;
}

/* ---------- simulation ---------- */
function updateCars(t, dt) {
  const g = gapsAt(tl.idx);
  const order = cars.slice().sort((a, b) => g[a.id] - g[b.id] || a.rank - b.rank);
  order.forEach((c, i) => { c.rank = i; c.gap = g[c.id]; c.ahead = i ? order[i - 1] : null; c.int = i ? c.gap - order[i - 1].gap : 0; });
  for (const c of cars) c.by = lerp(L.gridTop + c.gridSlot * L.carLen * 0.62, L.top + c.gap * L.scale, intro.e);

  // Lanes. Try all 2^n left/right assignments and keep the cheapest: never two cars nose-to-tail
  // in one lane closer than a car length, never two alongside cars swapping sides through each
  // other, and otherwise prefer the tidy P1-left / P2-right stagger.
  const near = L.carLen * 1.12, n = cars.length;
  let best = 0, bestCost = Infinity;
  for (let m = 0; m < (1 << n); m++) {
    let cost = 0;
    for (let i = 0; i < n && cost < bestCost; i++) {
      const a = cars[i], la = (m >> i) & 1 ? 1 : -1;
      if (la !== (a.rank % 2 ? 1 : -1)) cost += 1;
      if (la !== a.lane) cost += .1;
      for (let j = i + 1; j < n; j++) {
        const b = cars[j], lb = (m >> j) & 1 ? 1 : -1, dy = Math.abs(a.by - b.by);
        const th = a.lane === b.lane ? near : near * 1.2;      // hysteresis: harder to join a lane than to stay
        if (la === lb) { if (dy < th) cost += 50 + 100 * (1 - dy / th); }
        else if (dy < near * 1.2 && ((la !== a.lane && lb !== b.lane) || (lb - la) * (b.x - a.x) < -L.carW * .5)) cost += 1000;
      }
    }
    if (cost < bestCost) { bestCost = cost; best = m; }
  }
  cars.forEach((c, i) => { c.lane = (best >> i) & 1 ? 1 : -1; });

  // Lateral motion: spring to the lane, shove apart anything that overlaps.
  const k = 1 - Math.exp(-dt * 4.2);
  for (const c of cars) { c.x += (c.lane * L.laneOff - c.x) * k; c.side += (c.lane - c.side) * (1 - Math.exp(-dt * 7)); }
  // Required side-by-side clearance ramps in as two cars start to overlap nose-to-tail.
  const minSep = L.carW * 1.2;
  for (let pass = 0; pass < 4; pass++) {
    for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      const req = minSep * smooth(L.carLen * 1.25, L.carLen, Math.abs(a.by - b.by));
      const dx = b.x - a.x, adx = Math.abs(dx);
      if (adx >= req) continue;
      const dir = (adx > .01 ? Math.sign(dx) : 0) || Math.sign(b.lane - a.lane) || (a.seed < b.seed ? 1 : -1);
      const push = (req - adx) * .5;
      a.x -= dir * push; b.x += dir * push;
    }
    for (const c of cars) c.x = clamp(c.x, -L.xmax, L.xmax);
  }
  for (const c of cars) {
    c.vx = lerp(c.vx, (c.x - c.px) / Math.max(dt, .001), .18); c.px = c.x;
    // a little life: drift, surge, twitch
    const st = CAR_STYLES[carStyle], tw = t * st.pace;        // each car style has its own gait
    const w = (reduced ? 0 : TUNING.wobble) * intro.speedF * (L.carLen / 100), p = c.ph, ws = w * st.sway;
    c.wx = (Math.sin(tw * .83 + p[0]) * 2.3 + Math.sin(tw * 2.1 + p[1]) * 1.1) * ws;
    c.wy = (Math.sin(tw * .57 + p[2]) * 4.2 + Math.sin(tw * 1.43 + p[3]) * 2.1 + Math.sin(tw * 3.7 + p[4]) * .6) * w;
    const wvx = (Math.cos(tw * .83 + p[0]) * 2.3 * .83 + Math.cos(tw * 2.1 + p[1]) * 1.1 * 2.1) * ws * st.pace;
    // Tilt into the move, but never yaw into a neighbour: the closer a car alongside, the less tilt it gets.
    let lim = .14;
    for (const o of cars) {
      if (o === c) continue;
      const along = smooth(L.carLen * 1.3, L.carLen * 1.1, Math.abs(c.by + c.wy - o.by - (o.wy || 0)));
      if (along > 0) lim = Math.min(lim, lerp(.14, clamp((Math.abs(c.x + c.wx - o.x - (o.wx || 0)) - L.carW * 1.02) / (L.carLen * 1.05), 0, .14), along));
    }
    c.rot = clamp((c.vx + wvx) * .0036 + Math.sin(t * 6.1 + p[5]) * st.wag * Math.min(1, w), -lim, lim);

    if (TUNING.sparks && !reduced && intro.speedF > .95) {

    }

}

/* ---------- drawing ---------- */
function draw(t) {
  const { cx, roadHalf, kerbW, carLen, carW } = L;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const rl = cx - roadHalf, rw = roadHalf * 2;

  // grass, with mowing bands rolling by
  for (let y = (scroll % 512) - 512; y < H; y += 512) for (let x = (cx % 512) - 512; x < W; x += 512) ctx.drawImage(grass, x, y);
  const band = 170;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  for (let y = (scroll % (band * 2)) - band * 2; y < H; y += band * 2) ctx.fillRect(0, y, W, band);

  // run-off, barriers, grandstands, trees: the world beside the road
  drawTrackside(t);

  // verge + asphalt
  ctx.fillStyle = '#0a1a13'; ctx.fillRect(rl - kerbW - 9, 0, rw + kerbW * 2 + 18, H);
  ctx.save(); ctx.beginPath(); ctx.rect(rl, 0, rw, H); ctx.clip();
  for (let y = (scroll % 512) - 512; y < H; y += 512) for (let x = rl; x < rl + rw; x += 256) ctx.drawImage(asphalt, x, y);
  // rubbered-in racing lines
  const rg = ctx.createLinearGradient(rl, 0, rl + rw, 0);
  rg.addColorStop(0, 'rgba(255,255,255,.05)'); rg.addColorStop(.3, 'rgba(0,0,0,.24)'); rg.addColorStop(.5, 'rgba(0,0,0,.1)'); rg.addColorStop(.7, 'rgba(0,0,0,.24)'); rg.addColorStop(1, 'rgba(255,255,255,.05)');
  ctx.fillStyle = rg; ctx.fillRect(rl, 0, rw, H);
  // tarmac seams
  for (let y = (scroll % 430) - 430; y < H; y += 430) { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(rl, y, rw, 2); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fillRect(rl, y + 2, rw, 1); }
  // skid marks
  const cell = 640;
  ctx.lineCap = 'round'; ctx.lineWidth = carW * .15; ctx.strokeStyle = 'rgba(6,6,8,.3)';
  for (let k = Math.floor((scroll - H) / cell) - 1; k <= Math.floor(scroll / cell) + 1; k++) {
    if (k < 1) continue;
    const r = rng(k), n = r() < .8 ? 1 + (r() < .35) : 0, topY = scroll - (k + 1) * cell;
    for (let m = 0; m < n; m++) {
      const x0 = cx + (r() * 2 - 1) * roadHalf * .62, y0 = topY + r() * cell, len = 150 + r() * 280, bend = (r() * 2 - 1) * 26, sep = carW * .72;
      for (const dx of [-sep / 2, sep / 2]) { ctx.beginPath(); ctx.moveTo(x0 + dx, y0); ctx.quadraticCurveTo(x0 + dx + bend, y0 + len / 2, x0 + dx + bend * 1.7, y0 + len); ctx.stroke(); }
    }
  }
  // the grid we launched from, and the start line each time it comes round again
  const lap = Math.round(world / LAP);
  for (let n = Math.max(0, lap - 1); n <= lap + 1; n++) {
    const dy = L.gridTop + (world - plan(n).drs) * L.S;                 // DRS detection line
    if (dy > -10 && dy < H + 10) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(rl, dy, rw, 3); }
    const gy = L.gridTop + (world - n * LAP) * L.S;
    if (gy < -400 || gy > H + 400) continue;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    const sq = rw / 16;
    for (let r2 = 0; r2 < 2; r2++) for (let q = 0; q < 16; q++) if ((q + r2) % 2 === 0) ctx.fillRect(rl + q * sq, gy - 22 + r2 * sq - sq, sq, sq);
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    for (const c of cars) {
      const x = cx + (c.gridSlot % 2 ? 1 : -1) * L.laneOff, y = gy + c.gridSlot * carLen * .62 - 5, hw = carW * .58;
      ctx.beginPath(); ctx.moveTo(x - hw, y + 16); ctx.lineTo(x - hw, y); ctx.lineTo(x + hw, y); ctx.lineTo(x + hw, y + 16); ctx.stroke();
    }
  }
  ctx.restore();

  // edge lines + kerbs
  ctx.fillStyle = 'rgba(240,240,236,.82)'; ctx.fillRect(rl + 3, 0, 2.5, H); ctx.fillRect(rl + rw - 5.5, 0, 2.5, H);
  const bl = L.mobile ? 26 : 34;
  for (let y = (scroll % (bl * 2)) - bl * 2; y < H; y += bl * 2) {
    ctx.fillStyle = '#d6232b'; ctx.fillRect(rl - kerbW, y, kerbW, bl); ctx.fillRect(rl + rw, y + bl, kerbW, bl);
    ctx.fillStyle = '#eceae4'; ctx.fillRect(rl - kerbW, y + bl, kerbW, bl); ctx.fillRect(rl + rw, y, kerbW, bl);
  }
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(rl - kerbW, 0, 2, H); ctx.fillRect(rl + rw + kerbW - 2, 0, 2, H);
  // where the pit lane leaves and rejoins, it cuts through the kerb
  for (const s of streams['R-in'].segs) {
    if (s.type !== 'pit') continue;
    const Y = p => L.gridTop + (world - p) * L.S;
    for (const [p0, p1] of [[s.a, s.a + 300], [s.b - 300, s.b]]) {
      if (Y(p0) < 0 || Y(p1) > H) continue;
      ctx.save(); ctx.beginPath(); ctx.rect(cx + roadHalf - 2, Y(p1), kerbW + 12, Y(p0) - Y(p1)); ctx.clip();
      pitPath(s, Y); ctx.fillStyle = '#212329'; ctx.fill(); ctx.restore();
    }
  }

  // floodlight pool, and the pools under the trackside masts
  const fl = ctx.createRadialGradient(cx, H * .42, 0, cx, H * .42, Math.max(H * .62, 380));
  fl.addColorStop(0, 'rgba(255,244,224,.085)'); fl.addColorStop(1, 'rgba(255,244,224,0)');
  ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r] of glows) { const q = r * L.S; if (y > -q && y < H + q) ctx.drawImage(SC.pool, x - q, y - q, q * 2, q * 2); }
  // where scenery has to share the side with the labels, each label gets a darker plate
  if (L.dim) for (const c of cars) for (const [o, x0, x1] of [[c.oL, cx - L.edge, cx - L.edge - L.lw], [c.oR, cx + L.edge, cx + L.edge + L.lw]]) {
    if (o < .01 || !c.lh) continue;
    const pg = ctx.createLinearGradient(x0, 0, x1, 0);           // solid by the road, easing off outwards, like the label's own backdrop
    pg.addColorStop(0, `rgba(7,9,11,${(.86 * o).toFixed(3)})`); pg.addColorStop(.7, `rgba(7,9,11,${(.8 * o).toFixed(3)})`); pg.addColorStop(1, `rgba(7,9,11,${(.5 * o).toFixed(3)})`);
    ctx.fillStyle = pg; ctx.fillRect(Math.min(x0, x1), c.by - 1 + (c.ly || 0), L.lw, c.lh);
  }

  drawBeams(t);

  // ---- timing graphics ----
  const hud = intro.hud;
  if (hud > .01) {
    // nose lines: where each car "is"
    for (const c of cars) {
      if (c.by > H) continue;
      ctx.strokeStyle = rgba(c.tint, .2 * hud); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(rl + 6, c.by); ctx.lineTo(rl + rw - 6, c.by); ctx.stroke();
      const aL = clamp((-c.side - .15) / .7, 0, 1), aR = clamp((c.side - .15) / .7, 0, 1);
      ctx.lineWidth = 2;
      if (aL > 0) { ctx.strokeStyle = rgba(c.tint, .85 * hud * aL); ctx.beginPath(); ctx.moveTo(cx + c.x, c.by); ctx.lineTo(cx - L.edge, c.by); ctx.stroke(); }
      if (aR > 0) { ctx.strokeStyle = rgba(c.tint, .85 * hud * aR); ctx.beginPath(); ctx.moveTo(cx + c.x, c.by); ctx.lineTo(cx + L.edge, c.by); ctx.stroke(); }
    }
  }

  // sparks
  if (sparks.length) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineWidth = 1.6;
    for (const s of sparks) {
      const f = 1 - s.life / s.max;
      ctx.lineWidth = s.w || 1.6;
      ctx.strokeStyle = s.col ? s.col(f) : `rgba(255,${150 + 90 * f | 0},${40 + 120 * f * f | 0},${f})`;
      const tail = s.tail || .018;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * tail, s.y - s.vy * tail); ctx.stroke();
    }
    ctx.restore();
  }

  // cars, back of the field first
  for (const c of cars.slice().sort((a, b) => b.by - a.by)) {
    if (c.by > H + 40) continue;
    ctx.save();
    ctx.translate(cx + c.x + c.wx, c.by + c.wy + carLen / 2);
    ctx.rotate(c.rot);
    ctx.drawImage(c.sprite, -c.sw / 2, -c.sh / 2, c.sw, c.sh);
    CAR_STYLES[carStyle].live(c, t, carLen / 100);
    ctx.restore();
  }

  // gantries and bridges pass over the cars, but never over the gap numbers
  drawOverhead();

  if (hud > .01) {
    // interval callouts in the empty road
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineCap = 'butt';
    for (const c of cars) {
      const a = c.ahead; if (!a || c.by > H + carLen) continue;
      const y0 = a.by + carLen + 10, y1 = c.by - 9, free = y1 - y0;
      const al = smooth(18, 36, free) * hud; if (al < .01) continue;
      const mid = (y0 + y1) / 2, fs = clamp(free * .36, 14, L.mobile ? 24 : 32), half = fs * .68;
      const cap = free > fs + 74;
      ctx.strokeStyle = `rgba(255,255,255,${.6 * al})`; ctx.lineWidth = 1.25;
      ctx.beginPath();
      ctx.moveTo(cx - 9, y0); ctx.lineTo(cx + 9, y0); ctx.moveTo(cx - 9, y1); ctx.lineTo(cx + 9, y1);
      const up = mid - half - (cap ? 15 : 0);
      if (up - y0 > 3) { ctx.moveTo(cx, y0); ctx.lineTo(cx, up); }
      if (y1 - (mid + half) > 3) { ctx.moveTo(cx, mid + half); ctx.lineTo(cx, y1); }
      ctx.stroke();
      ctx.font = `italic 700 ${fs}px ${FONT}`;
      ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 8 * DPR;
      ctx.fillStyle = `rgba(255,255,255,${.96 * al})`;
      ctx.fillText('+' + c.int.toFixed(3), cx, mid + 1);
      if (cap) { ctx.font = `600 10px ${FONT}`; ctx.fillStyle = `rgba(255,255,255,${.6 * al})`; ctx.fillText('I N T E R V A L', cx, mid - half - 5); }
      ctx.shadowBlur = 0;
    }
  }

  // header / footer shade + vignette
  let sh = ctx.createLinearGradient(0, 0, 0, 150);
  sh.addColorStop(0, 'rgba(8,10,12,.82)'); sh.addColorStop(1, 'rgba(8,10,12,0)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, W, 150);
  for (const b of L.corners) {                     // a little extra night behind the wordmark and the date, now that things pass under them
    const rx = b.width * .5 + 70, ry = b.height * .5 + 46;
    ctx.save(); ctx.translate(b.left + b.width / 2, b.top + b.height / 2); ctx.scale(rx, ry);
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); cg.addColorStop(0, 'rgba(8,10,12,.72)'); cg.addColorStop(.55, 'rgba(8,10,12,.6)'); cg.addColorStop(1, 'rgba(8,10,12,0)');
    ctx.fillStyle = cg; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
  }
  sh = ctx.createLinearGradient(0, H - 150, 0, H);
  sh.addColorStop(0, 'rgba(8,10,12,0)'); sh.addColorStop(.72, 'rgba(8,10,12,.8)'); sh.addColorStop(1, 'rgba(8,10,12,.92)');
  ctx.fillStyle = sh; ctx.fillRect(0, H - 150, W, 150);
  const vg = ctx.createRadialGradient(cx, H / 2, Math.min(W, H) * .35, cx, H / 2, Math.hypot(W, H) * .56);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function updateLabels() {
  const near = Math.round(tl.idx), dist = Math.abs(tl.idx - near), snap = snaps[near];
  const noteO = (1 - smooth(.04, .2, dist)).toFixed(2);
  for (const c of cars) {
    const e = snap.entry[c.id] || {};
    setText(c, 'pos', 'P' + (c.rank + 1));
    setText(c, 'name', e.name || c.lab.name);
    setText(c, 'gap', c.rank ? '+' + c.gap.toFixed(3) : 'LEADER');
    setText(c, 'int', c.rank > 1 ? 'INT +' + c.int.toFixed(3) : '');
    setText(c, 'drs:on', c.rank > 0 && c.int < TUNING.drsWindow);
    setText(c, 'fl:on', c.rank === 0);
    setText(c, 'el:lead', c.rank === 0);
    setText(c, 'sub', e.sub || c.lab.sub || '');
    setText(c, 'note', e.note || '');
    const vis = intro.hud * (c.by > L.bottom + 30 ? 0 : 1);
    const oL = clamp((-c.side - .15) / .7, 0, 1) * vis, oR = clamp((c.side - .15) / .7, 0, 1) * vis;
    c.oL = oL; c.oR = oR;
  }
  // two labels on the same side never stack on top of each other: the one behind slides down
  if (!L.lh) L.lh = Math.max(...cars.map(c => c.lh = c.els.left.el.offsetHeight)) + 6;
  for (const key of ['oL', 'oR']) {
    let floor = -1e9;
    for (const c of cars.filter(c => c[key] > .5).sort((a, b) => a.by - b.by)) {
      c.push = Math.max(0, floor - c.by); floor = c.by + c.push + L.lh;
    }
  }
  for (const c of cars) {
    c.ly = lerp(c.ly || 0, c.push || 0, .18);
    const y = (c.by - 1 + c.ly).toFixed(1), oL = c.oL, oR = c.oR;
    const l = c.els.left, r = c.els.right;
    l.el.style.opacity = oL.toFixed(2); r.el.style.opacity = oR.toFixed(2);
    l.el.style.transform = `translate(${(L.cx - L.edge - L.lw).toFixed(1)}px,${y}px)`;
    r.el.style.transform = `translate(${(L.cx + L.edge).toFixed(1)}px,${y}px)`;
    l.r3.style.opacity = r.r3.style.opacity = noteO;
  }
}

/* ---------- main loop ---------- */
function frame(now) {
  const t = now / 1000, dt = Math.min(.05, Math.max(.001, t - last)); last = t;
  stepIntro(t);
  stepAnim(now);
  const step = TUNING.speed * (reduced ? .35 : 1) * intro.speedF * dt;
  scroll += step; world += step / L.S;
  updateCars(t, dt);
  draw(t);
  updateLabels();
  syncTimelineUI();
  requestAnimationFrame(frame);
}

layout();
for (const c of cars) { c.x = c.px = c.lane * L.laneOff; }
addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
last = performance.now() / 1000;
requestAnimationFrame(frame);

// tiny handle for the console: fastestLab.goTo(0), fastestLab.play(), fastestLab.setCars('gt'), fastestLab.world += 5000
window.fastestLab = { goTo, play, skipIntro: finishIntro, setCars: setCarStyle, get carStyle() { return carStyle; }, get layout() { return L; }, get idx() { return tl.idx; }, set idx(v) { finishIntro(); tl.anim = null; tl.queue = []; tl.idx = clamp(v, 0, LAST); }, cars, snaps,
  // distance driven, in car units: fastestLab.world += 5000 skips ahead along the lap
  get world() { return world; }, set world(v) { if (v < world) for (const st of Object.values(streams)) Object.assign(st, { pos: ZA - 2900, n: 0, prev: '', segs: [], ad: st.sd < 0 ? 0 : 13, name: st.sd < 0 ? 0 : 4, word: st.sd < 0 ? 0 : 3 }); world = +v || 0; } };
})();
</script>
