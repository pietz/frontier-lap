<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frontier Lap · the AI model grand prix</title>
<meta name="description" content="Who has the best AI model lineup right now? The labs as race cars, the gaps as the message. One opinion, zero benchmarks.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M11 24 14 8h10M12.5 16h8' stroke='%23b65cff' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --ink: #f4f5f7;
    --mute: #98a0aa;
    --purple: #b65cff;   /* timing-screen purple: fastest of all */
    --green: #2ee57a;    /* timing-screen green */
    --yellow: #ffd23f;
    --font: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { touch-action: manipulation; }
  #track { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- wordmark ---------- */
  #brand { position: fixed; z-index: 5; left: max(16px, 2.5vw); top: max(14px, 2.4vh); }
  #brand h1 { margin: 0; font: italic 800 clamp(34px, 4.3vw, 58px)/.86 var(--font); letter-spacing: .005em; text-transform: uppercase; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  #brand h1 em { font-style: inherit; color: var(--purple); }
  #brand .sectors { display: flex; gap: 4px; margin: 9px 0 8px 2px; }
  #brand .sectors i { width: 30px; height: 4px; transform: skewX(-24deg); background: var(--purple); }
  #brand .sectors i:nth-child(2) { background: var(--green); }
  #brand .sectors i:nth-child(3) { background: var(--yellow); }
  #brand p { margin: 0; font: 600 clamp(11px, 1vw, 14px)/1.2 var(--font); letter-spacing: .17em; text-transform: uppercase; color: var(--mute); }

  /* ---------- date stamp + start lights ---------- */
  #stamp { position: fixed; z-index: 5; right: max(16px, 2.5vw); top: max(16px, 2.6vh); text-align: right; }
  #stamp .lights { display: inline-flex; gap: 5px; padding: 5px 7px; border-radius: 9px; background: rgba(5,6,8,.8); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  #stamp .lights i { width: 10px; height: 10px; border-radius: 50%; background: #2a1214; transition: background .08s, box-shadow .08s; }
  #stamp .lights i.on { background: #ff2a1f; box-shadow: 0 0 10px 2px rgba(255,42,31,.75); }
  #stamp .date { margin-top: 8px; font: italic 700 clamp(22px, 2.5vw, 34px)/1 var(--font); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
  #stamp .headline { margin-top: 5px; font: 600 clamp(11px, 1vw, 14px)/1.2 var(--font); letter-spacing: .15em; text-transform: uppercase; color: var(--mute); transition: opacity .25s; }
  #stamp .date small { font-size: .62em; font-weight: 600; letter-spacing: .08em; color: var(--mute); margin-right: .3em; }
  #stamp .demo[hidden] { display: none; }
  #stamp .demo { display: inline-block; margin-top: 6px; font: 600 10px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--yellow); border: 1px solid rgba(255,210,63,.45); border-radius: 3px; padding: 3px 5px 2px; transition: opacity .25s; }

  /* ---------- car labels: compact on every screen. Position and logo, the name under them,
     and a line or two about the lab. Their width is capped (--lw, set in layout()). ---------- */
  #labels { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; width: var(--lw); padding: 8px 0 8px 11px; opacity: 0; will-change: transform, opacity;
    background: linear-gradient(90deg, rgba(7,9,11,.8), rgba(7,9,11,.45) 55%, rgba(7,9,11,0));
    border-top: 2px solid; border-image: linear-gradient(90deg, var(--tint), transparent 94%) 1; }
  .label.left { padding: 8px 11px 8px 0; text-align: right;
    background: linear-gradient(270deg, rgba(7,9,11,.8), rgba(7,9,11,.45) 55%, rgba(7,9,11,0));
    border-image: linear-gradient(270deg, var(--tint), transparent 94%) 1; }
  /* the lab whose event this step is: its label lights up in its own colour, from the road outwards */
  .label::before { content: ''; position: absolute; inset: -2px 0 0; opacity: var(--hot, 0); pointer-events: none;
    background: linear-gradient(90deg, color-mix(in srgb, var(--tint) 46%, transparent), color-mix(in srgb, var(--tint) 12%, transparent) 46%, transparent 86%);
    border-top: 2px solid var(--tint); }
  .label.left::before { background: linear-gradient(270deg, color-mix(in srgb, var(--tint) 46%, transparent), color-mix(in srgb, var(--tint) 12%, transparent) 46%, transparent 86%); }
  .label > * { position: relative; }
  .r1 { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; white-space: nowrap; }
  .left .r1 { flex-direction: row-reverse; justify-content: flex-start; }
  .pos { font: italic 800 29px/1 var(--font); color: var(--tint); }
  .badge { flex: none; width: 23px; height: 23px; border-radius: 50%; background: var(--bbg); display: grid; place-items: center; box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); overflow: hidden; }
  .badge svg { display: block; overflow: visible; width: calc(var(--ls, .7) * 100%); height: calc(var(--ls, .7) * 100%); }
  .name { flex-basis: 100%; font: italic 700 24px/1 var(--font); text-transform: uppercase; letter-spacing: .01em; }
  /* the condensed face keeps a note to two calm lines in a narrow label (three on a phone) */
  .note { margin-top: 6px; font: 500 15.5px/1.22 var(--font); letter-spacing: .012em; color: #d9dce1; text-wrap: pretty;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .note:empty { display: none; }
  .label.gone .note { font-style: italic; color: var(--mute); }       /* a car pulling off: its note says so, quietly */
  /* a crowded field: labels drop the note line so every car keeps its name */
  .dense .note { display: none; }
  @media (min-width: 641px) { .dense .pos { font-size: 26px; } .dense .name { font-size: 21px; } }

  /* ---------- replay: a quick dip to black while everything goes back to the grid ---------- */
  #curtain { position: fixed; inset: 0; z-index: 4; background: var(--bg); opacity: 0; pointer-events: none; }

  /* ---------- timeline ---------- */
  #deck { position: fixed; z-index: 5; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(580px, calc(100% - 28px)); display: flex; gap: 16px; align-items: flex-start; padding-right: 26px;
    opacity: 0; transition: opacity .6s; }
  body.live #deck { opacity: 1; }
  #play { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.24); background: rgba(12,14,18,.72); color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: border-color .15s, background .15s; }
  #play:hover { border-color: var(--purple); background: rgba(182,92,255,.18); }
  #play svg { width: 14px; height: 14px; fill: currentColor; }
  #play .pause { display: none; }
  #play.playing .pause { display: block; }
  #play.playing .go { display: none; }
  #play .re { display: none; }
  #play.atend:not(.playing) .re { display: block; }
  #play.atend:not(.playing) .go { display: none; }
  #tl { position: relative; flex: 1; height: 62px; }
  #tl .rail { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.17); }
  #tl .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, rgba(182,92,255,.15), var(--purple)); }
  #tl .tk { position: absolute; top: 9px; width: 2px; height: 22px; margin-left: -1px; background: rgba(255,255,255,.4); transition: background .2s; }
  #tl .tk.on { background: #fff; }
  /* one step per event: a ruler. Short marks for events, a tall one where a year begins */
  #tl.ruler .tk { top: 13px; height: 14px; background: rgba(255,255,255,.3); }
  #tl.ruler .tk.year { top: 7px; height: 26px; background: rgba(255,255,255,.62); }
  #tl.ruler .tk.on { top: 9px; height: 22px; background: #fff; }
  #tl .tick { position: absolute; top: 35px; transform: translateX(-50%); background: none; border: 0; padding: 4px 8px 6px; color: var(--mute); font: 600 13px/1 var(--font); letter-spacing: .15em; white-space: nowrap; cursor: pointer; z-index: 5; transition: color .15s; }
  #tl .tick.year { color: #dfe2e7; }
  #tl .tick:hover, #tl .tick.on { color: #fff; }
  #tl .tick.mute { visibility: hidden; }
  #tl .tick:focus-visible, #play:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  #tl .knob { position: absolute; top: 20px; left: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(182,92,255,.4), 0 2px 12px rgba(0,0,0,.7); pointer-events: none; z-index: 2; }
  #scrub { position: absolute; left: -12px; top: 3px; width: calc(100% + 24px); height: 34px; margin: 0; opacity: 0; cursor: grab; z-index: 4; }
  #scrub:active { cursor: grabbing; }
  #scrub:focus-visible ~ .knob { box-shadow: 0 0 0 4px var(--purple), 0 0 0 7px rgba(255,255,255,.5); }
  /* ---------- the caption: one line of commentary per step, a lower third above the timeline ---------- */
  #cap { position: fixed; z-index: 5; left: 50%; bottom: calc(74px + env(safe-area-inset-bottom)); width: min(640px, calc(100% - 28px));
    transform: translateX(-50%); display: flex; justify-content: center; pointer-events: none; opacity: 0; --tint: var(--purple); }
  #cap .plate { position: relative; display: flex; align-items: center; gap: 12px; max-width: 100%; padding: 8px 16px 9px 17px;
    background: linear-gradient(90deg, rgba(9,11,14,.92), rgba(9,11,14,.84) 62%, rgba(9,11,14,.5)); }
  #cap .plate::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tint); }
  #cap .badge { width: 24px; height: 24px; }
  #cap .badge:empty { display: none; }
  #cap p { margin: 0; font: 500 16px/1.3 var(--body); color: #f1f2f4; text-wrap: balance;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #cap.measure { visibility: hidden; opacity: 0 !important; }

  #fine, #hint { position: fixed; z-index: 4; bottom: calc(20px + env(safe-area-inset-bottom)); margin: 0; font: 600 12px/1.3 var(--font); letter-spacing: .15em; text-transform: uppercase; color: var(--mute); opacity: .85; }
  #fine { left: max(16px, 2.5vw); }
  #fine a { color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.3); transition: border-color .15s, color .15s; }
  #fine a:hover, #fine a:focus-visible { color: var(--purple); border-color: var(--purple); outline: none; }
  #hint { right: max(16px, 2.5vw); text-align: right; }
  #hint kbd { font: inherit; color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 1px 5px; }

  @media (max-width: 900px) { #fine, #hint { display: none; } }
  @media (max-width: 640px) {
    #brand .sectors { margin: 7px 0 6px 2px; }
    #brand .sectors i { width: 22px; height: 3px; }
    #brand p span { display: none; }
    #stamp .lights i { width: 8px; height: 8px; }
    #stamp .headline { max-width: 150px; margin-left: auto; }
    .label { padding: 6px 0 6px 8px; }
    .label.left { padding: 6px 8px 6px 0; }
    .r1 { gap: 3px 6px; }
    .pos { font-size: 25px; }
    .badge { width: 19px; height: 19px; }
    .name { font-size: 19px; }
    .note { margin-top: 5px; font-size: 14px; -webkit-line-clamp: 3; }
    #deck { padding-right: 14px; }
    #tl .tick { font-size: 12px; letter-spacing: .1em; }
    #cap .plate { gap: 10px; padding: 7px 12px 8px 14px; }
    #cap .badge { width: 21px; height: 21px; }
    #cap p { font-size: 14px; line-height: 1.3; -webkit-line-clamp: 3; }
  }
  @media (max-height: 560px) {
    #brand p, #stamp .headline, #stamp .lights, .note, #fine, #hint, #cap { display: none; }
    #brand h1 { font-size: 30px; }
    #stamp .date { margin-top: 0; font-size: 22px; }
    .label, .label.left { padding-top: 5px; padding-bottom: 3px; }
    .pos { font-size: 22px; } .name { font-size: 18px; }
    .badge { width: 18px; height: 18px; }
  }
  @media (max-height: 560px) and (min-width: 641px) { .r1 { flex-wrap: nowrap; } .name { flex-basis: auto; } }   /* too low to stack: one row */
</style>
</head>
<body>
<canvas id="track" aria-hidden="true"></canvas>
<div id="labels" aria-live="off"></div>
<div id="curtain" aria-hidden="true"></div>

<header id="brand">
  <h1>Frontier <em>Lap</em></h1>
  <div class="sectors"><i></i><i></i><i></i></div>
  <p>The AI model grand prix<span> · gaps by vibes</span></p>
</header>

<div id="stamp">
  <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="date"></div>
  <div class="headline"></div>
  <div class="demo" hidden>Illustrative snapshot</div>
</div>

<div id="cap" aria-live="polite"><div class="plate"><span class="badge"></span><p></p></div></div>

<footer id="deck">
  <button id="play" aria-label="Replay the season">
    <svg class="go" viewBox="0 0 14 14"><path d="M3 1.2v11.6L13 7z"/></svg>
    <svg class="pause" viewBox="0 0 14 14"><path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/></svg>
    <svg class="re" viewBox="0 0 14 14"><path d="M7 1.6a5.4 5.4 0 1 1-5.1 3.6l1.6.6A3.7 3.7 0 1 0 7 3.3v1.9L3.6 2.45 7 -.3z"/></svg>
  </button>
  <div id="tl">
    <div class="rail"><div class="fill"></div></div>
    <input id="scrub" type="range" min="0" max="1000" step="1" value="1000" aria-label="Timeline">
    <div class="knob"></div>
  </div>
</footer>
<p id="fine"><a href="https://x.com/gopietz" target="_blank" rel="noopener">@gopietz</a><br>Gaps are vibes, not benchmarks.</p>
<p id="hint"><kbd>←</kbd> <kbd>→</kbd> travel in time</p>

<!-- ═══ DATA · the standings, the labs and their logos. This is the block to edit. ═══ -->
<script id="race-data">

     RACE        who was where, and when      data/race.csv, copied in by scripts/build.py
     LABS        who the labs are             name, sub, livery, rebrands
     LOGOS       the marks on the cars        SVG path data

   Edit data/race.csv (any spreadsheet or text editor), then run
       python3 scripts/build.py
   which checks it and copies it in between the RACE markers below, so
   index.html stays one self-contained file.

   race.csv · one row per step of the replay
   ─────────────────────────────────────────

       date,event,p1,p2,p3,p4,p5,s1,s2,s3,s4,s5,caption
       2026-11-10,google,anthropic,google,openai,meta,moonshot,10,8,6,3,1,"Carbon opens to everyone."

   date      YYYY-MM-DD. Rows go in date order. Two releases on one day are two
             rows with the same date: two steps, in the order of the file.
   event     the lab whose event this is: its car glows (may be empty)
   p1..p5    the top five lab ids from LABS, P1 first
   s1..s5    whole numbers, each lower than the one before (no ties: P2 is at
             least one below P1). The top of the screen is s1, the bottom is 0, so
             a car is placed by its number on that scale. Keep s1 at 20 so one
             unit means the same distance in every step.
   caption   the line shown at the bottom (quote it if it has a comma)

   The old hand-made table format (SNAPSHOTS) still works: define
   var SNAPSHOTS = `...` here instead of RACE. See git tag v2-hand-gaps.
   ════════════════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════════════════
   LABS · the registry. One entry per lab that has ever been on track.

<script>
/* ════════════════════════════════════════════════════════════════════════
   SETTINGS · how it drives and how the replay plays.
   (What it shows is in the DATA block above: standings, labs and logos.)
   ════════════════════════════════════════════════════════════════════════ */

const TUNING = {
  speed: 10,         // road scroll, in car lengths per second: bigger cars, faster road
  field: 5,          // cars on track: the top this many of each snapshot. A lab that falls below
                     // drops back off the screen; the labs listed after them are kept for later.
  flames: true,      // exhaust flames now and then

  // How alive the cars are: every car drifts across its lane, surges and falls back, has a look
  // at the car ahead now and then, and turns its nose into each move.
  wobble: 1,         // how far: 0 = on rails, 1 = alive, 2 = rookies
  pace: 1,           // how fast: 0.6 = heavy and unhurried, 1 = alive, 1.5 = nervous

  // How big the cars are: their length as a share of the height the field has, from the leader's
  // nose down to the caption. Phones are the exception: there the width of the screen decides.
  carSize: 0.16,     // 0.13 = small cars, long gaps; 0.18 = big cars that fill the road

  // The gaps are drawn to scale: within one picture, twice the gap is twice the road. How much
  // road a second gets is chosen per snapshot, so that a tight field still uses the height.
  // One exception: four cars can't sit closer together than a car length (the road seats three
  // abreast, see below). Where a snapshot packs four cars tighter than that, that pack alone is
  // opened up just enough, and the rest of that picture closes up a little to make the room. The
  // numbers on the road still show the real gaps. frontierLap.check() lists those snapshots.
  zoom: 1.75,        // a tight field is stretched up to this many times to fill the screen.
                     // 1 = one fixed scale for the whole timeline (a tight field then sits in the
                     // top half), 3 = every snapshot runs from the top to the bottom.

  // The room cars keep around each other, at rest and in every overtake. The road is three such
  // lanes wide, and no car ever shares its lane with a car it isn't clear of nose to tail. That is
  // what makes "never more than three abreast" a rule and not luck.
  sideGap: [0.50, 1.00],   // clear road between two cars side by side, in car widths: at least the
                     // first, and up to the second where the screen is wide enough for a broader
                     // road. One number = the same on every screen.
  noseGap: 0.25,     // clear road between two cars nose to tail in one lane, in car lengths
  // The wobble lives inside those two gaps. A car with empty road around it moves freely; next to
  // another car, both get only as much drift and surge as leaves `clearance` between them even if
  // they lean towards each other at the same moment. So wobble and pace change how lively the
  // field looks, never how close two cars can come.
  clearance: 0.09,   // the least road ever left between two cars, in car lengths
};

/* ────────────────────────────────────────────────────────────────────────
   PLAYBACK · the replay you get from the play button (or the space bar).

   A replay goes back to the first snapshot, shows the start lights,
   launches the labs of that first snapshot off the grid, then drives
   through every snapshot up to the latest. Each snapshot is one step:
   the cars MOVE to the new standings, then HOLD there so you can read it.

   spacing     How the replay's time is shared between the steps:
               'events'    every step is one event, however far apart the
                           dates are. Its move takes as long as the cars
                           need to get there calmly (`move`, `topSpeed`,
                           `sideSpeed`), then the picture rests for
                           `hold[0]` seconds. The timeline shows one evenly
                           spaced mark per event. `length` and `transition`
                           are not used.
               'calendar'  a step lasts in proportion to the real time
                           between its two snapshots (six quiet months take
                           longer than one busy month), and the timeline is
                           a calendar
               'uniform'   every step lasts the same share of `length`, on
                           the calendar timeline
   move        'events' only. [shortest, longest] seconds the cars take to
               move from one snapshot to the next. How long a step gets
               within that follows from how far its cars have to go: a
               small nudge takes the shortest, a big reshuffle (or a lab
               driving in from behind the field) takes longer, because:
   topSpeed    'events' only. The fastest any car may travel along the road
               at the peak of a move, in field heights per second (the
               field: from the leader's nose down to the caption). 0.25 = a
               car at full speed would need four seconds from the front to
               the back. Lower = calmer and a longer replay.
   sideSpeed   'events' only. The same across the road, in road widths per
               second: how briskly a car changes lanes at most.
               Every move eases in and out, so those peaks are only reached
               in the middle of it. If the longest `move` is too short for
               a step, the longest `move` wins and that step runs a little
               faster than the two limits. `frontierLap.check()` lists every

      const lx = X(zo - 31 * S);                                                                    // light panel: track is green
      ctx.fillStyle = '#0b0d10'; ctx.fillRect(lx - 4 * S, y - 9 * S, 8 * S, 18 * S);
      ctx.fillStyle = '#2ee57a'; ctx.fillRect(lx - 2.2 * S, y - 7 * S, 4.4 * S, 14 * S);
      dot(SC.green, lx, y, 17 * S, .5);
      ctx.fillStyle = '#e8762b'; for (const [dx, dy] of [[-14, 26], [-20, -24]]) { ctx.beginPath(); ctx.arc(x + sd * dx * S, y + dy * S, 2.6 * S, 0, TAU); ctx.fill(); }
    }
    // floodlight masts
    for (let m = Math.floor(pBot / 1500); m <= pTop / 1500; m++) {
      const p = m * 1500 + (sd > 0 ? 0 : 750), o = Math.round(p / LAP) * LAP, y = Y(p), x0 = X(zo + 14 * S), x1 = X(zo - 17 * S);
      if (sd > 0 && p > o - 1200 && p < o + 1300) continue;                                         // the pit building lights its own lane
      glows.push([X(Math.max(z0 + 40 * S, zo - 150 * S)), y, 340]);
      if (y < -60 || y > H + 60) continue;
      ctx.strokeStyle = '#3d424b'; ctx.lineWidth = 2.5 * S; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.fillStyle = '#2b2f36'; ctx.beginPath(); ctx.arc(x0, y, 5 * S, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff3d6'; ctx.fillRect(x1 - 3 * S, y - 13 * S, 6 * S, 26 * S);

}

/* overhead: gantries and footbridges, drawn over the cars */
function drawOverhead() {
  const { cx, S, z0, zo } = L, base = L.gridTop + world * S, n0 = Math.round(world / LAP);
  const truss = y => {
    const x0 = cx - z0 - 10 * S, x1 = cx + z0 + 10 * S, h = 6 * S;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x0 + 5 * S, y - h + 10 * S, x1 - x0, h * 2);
    ctx.strokeStyle = 'rgba(196,202,210,.9)'; ctx.lineWidth = Math.max(1, 1.6 * S); ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y - h); ctx.lineTo(x1, y - h); ctx.moveTo(x0, y + h); ctx.lineTo(x1, y + h); ctx.stroke();
    ctx.strokeStyle = 'rgba(196,202,210,.55)'; ctx.lineWidth = Math.max(.8, S);
    ctx.beginPath(); ctx.moveTo(x0, y + h);
    for (let x = x0, i = 0, n = Math.round((x1 - x0) / (h * 2)), dx = (x1 - x0) / n; i < n; i++) { ctx.lineTo(x + dx / 2, y - h); ctx.lineTo(x += dx, y + h); }
    ctx.stroke();
    ctx.fillStyle = '#343941'; ctx.fillRect(x0 - 5 * S, y - 8 * S, 10 * S, 16 * S); ctx.fillRect(x1 - 5 * S, y - 8 * S, 10 * S, 16 * S);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x0 - 5 * S, y - 8 * S, 10 * S, 1.5); ctx.fillRect(x1 - 5 * S, y - 8 * S, 10 * S, 1.5);
  };
  const off = y => y < -90 * S || y > H + 90 * S;
  for (let n = Math.max(0, n0 - 1); n <= n0 + 1; n++) {
    const pl = plan(n);
    let y = base - (n * LAP + 66) * S;
    if (!off(y)) {                                                                                  // start gantry: the five lights
      truss(y);
      for (let i = 0; i < 5; i++) {
        const x = cx + (i - 2) * 25 * S, on = n === 0 && i < intro.lit;
        ctx.fillStyle = '#0b0c0f'; ctx.fill(rr(x - 9 * S, y - 7 * S, 18 * S, 14 * S, 3 * S));
        ctx.fillStyle = on ? '#ff2a1f' : '#3a1517'; ctx.beginPath(); ctx.arc(x, y, 4.2 * S, 0, TAU); ctx.fill();
        if (on) dot(SC.flash, x, y, 13 * S, .5);
      }
    }
    y = base - pl.drs * S;
    if (!off(y)) {                                                                                  // DRS detection point
      truss(y);
      ctx.fillStyle = '#0c7a40'; ctx.fillRect(cx - 50 * S, y - 9 * S, 100 * S, 18 * S);
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; ctx.strokeRect(cx - 50 * S, y - 9 * S, 100 * S, 18 * S);
      stamp(label('DRS DETECTION', 12.5 * S, '700', '#ffffff'), cx, y);
    }
    for (const b of pl.bridges) {                                                                   // footbridge with a banner
      y = base - b.p * S; if (off(y)) continue;
      const h = 22 * S, [bg, fg] = SCHEMES[b.i % 4], bw = z0 + 14 * S;
      ctx.fillStyle = 'rgba(0,0,0,.34)'; ctx.fillRect(0, y - h + 13 * S, W, h * 2);
      for (const sd of [-1, 1]) { ctx.fillStyle = '#23272e'; ctx.fillRect(cx + sd * (zo + 22 * S) - 30 * S, y - 40 * S, 60 * S, 80 * S); ctx.fillStyle = 'rgba(255,255,255,.07)'; for (let i = 0; i < 6; i++) ctx.fillRect(cx + sd * (zo + 22 * S) - 30 * S, y - 38 * S + i * 13 * S, 60 * S, 1.5); }
      const dg = ctx.createLinearGradient(0, y - h, 0, y + h); dg.addColorStop(0, '#272b33'); dg.addColorStop(1, '#191c22');
      ctx.fillStyle = dg; ctx.fillRect(0, y - h, W, h * 2);
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(0, y - h, W, 1.5); ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(0, y + h - 1.5, W, 1.5);
      ctx.fillStyle = bg; ctx.fillRect(cx - bw, y - 15 * S, bw * 2, 30 * S);
      const c = label(BRIDGES[b.i % BRIDGES.length], 23 * S, 'italic 800', fg);
      stamp(c, cx, y, 0, Math.min(1, (bw * 2 - 12 * S) / c.w));
    }
  }
}

/* ---------- five lights, then away we go (replays only) ---------- */
const lights = [...document.querySelectorAll('#stamp .lights i')];
function setLights(n) { if (intro.lit === n) return; intro.lit = n; lights.forEach((el, i) => el.classList.toggle('on', i < n)); }
function setIntro(k) {              // k = seconds since the cars lined up on the grid
  const go = PLAYBACK.lights, u = go / 2.26, run = Math.max(.1, PLAYBACK.launch);
  setLights(k < go ? clamp(Math.floor((k - .5 * u) / (.24 * u)) + 1, 0, 5) : 0);
  const p = clamp((k - go) / run, 0, 1);
  intro.p = p;                      // the launch off the grid is a planned step like any other, eased by the plan
  intro.speedF = easeOut(clamp((k - go) / (run * .57), 0, 1));

/* ---------- timeline ---------- */
const scrub = $('#scrub'), knob = $('#tl .knob'), fill = $('#tl .fill'), playBtn = $('#play');
const dateEl = $('#stamp .date'), headEl = $('#stamp .headline'), demoEl = $('#stamp .demo');
const tlEl = $('#tl');
tlEl.classList.toggle('ruler', EVENTS);
// Every snapshot gets a mark on the rail. Which marks get a date under them:
//   calendar   each snapshot its month ("APR 25"), as many as fit

//              month where a quarter begins ("APR"), as many as fit. Twenty-odd marks are a
//              ruler; it is the years and quarters that make it readable.
const ticks = snaps.map((s, i) => {
  const d = new Date(s.time), m = MONTHS[d.getUTCMonth()], y = d.getUTCFullYear(), was = i ? new Date(snaps[i - 1].time) : null;
  const end = i === 0 || i === LAST, year = !!was && was.getUTCFullYear() !== y;
  const quarter = year || (!!was && Math.floor(was.getUTCMonth() / 3) !== Math.floor(d.getUTCMonth() / 3));
  const b = document.createElement('button'), tk = document.createElement('i');
  b.type = 'button'; b.style.left = tk.style.left = tPos[i] * 100 + '%';
  b.className = 'tick' + (EVENTS && year && !end ? ' year' : ''); tk.className = 'tk' + (EVENTS && year ? ' year' : '');
  b.textContent = !EVENTS || end ? `${m} ${String(y).slice(2)}` : year ? y : m;
  b.setAttribute('aria-label', `Go to ${d.getUTCDate()} ${m} ${y}${s.headline ? ': ' + s.headline : ''}`);
  b.addEventListener('click', () => goTo(i));

});
if (LAST < 1) { $('#deck').style.display = 'none'; $('#hint').style.display = 'none'; }
function thinTicks() {              // every snapshot keeps its mark; dates only where they fit, the important ones first
  const w = tlEl.clientWidth || 1, pad = L.mobile ? 7 : 12, placed = [];
  const order = ticks.map((_, i) => i).filter(i => ticks[i].rank < 9).sort((a, b) => ticks[a].rank - ticks[b].rank || (EVENTS ? a - b : b - a));
  for (const k of ticks) k.b.classList.add('mute');
  for (const i of order) {
    const x = tPos[i] * w, hw = Math.max(8, ticks[i].b.offsetWidth - 16) / 2;      // the text itself, without the button's padding
    if (!placed.every(q => Math.abs(q.x - x) >= q.hw + hw + pad)) continue;
    placed.push({ x, hw }); ticks[i].b.classList.remove('mute');

}

/* ---------- the caption, and the car it is about ----------
   One line of commentary per step. It belongs to the snapshot the cars are driving TO, so it
   comes up as they set off and stays while they rest there; going back in time it is the one
   being returned to. A change of caption is a quick fade out and a slower one in. */
const capEl = $('#cap'), capBadge = $('#cap .badge'), capText = $('#cap p');
const ev = { shown: -1, o: 0, t0: -1e3, dir: 1, has: false };
function fillCaption(i) {
  const s = snaps[i], c = s.event ? cars.find(c => c.id === s.event) : null;
  capText.textContent = s.caption;
  if (c) {
    const logo = LOGOS[whoIs(c, s.time, s.entry[c.id] || {}).logo] || null;
    capBadge.innerHTML = logoSvg(logo);
    capEl.style.setProperty('--tint', c.tint); capEl.style.setProperty('--bbg', (logo && logo.bg) || c.lab.accent);
  } else { capBadge.innerHTML = ''; capEl.style.setProperty('--tint', 'var(--purple)'); }
  return !!s.caption;
}
function measureCaption() {         // how much height the tallest caption needs at this screen width (0: no captions, or no room for them)
  if (!HAS_CAPTIONS) return 0;
  capEl.classList.add('measure');
  let h = 0;
  for (let i = 0; i <= LAST; i++) if (fillCaption(i)) h = Math.max(h, capEl.offsetHeight);
  capEl.classList.remove('measure');
  if (ev.shown >= 0) ev.has = fillCaption(ev.shown);
  return h;
}
function syncEvent(t, dt) {
  if (replay.on) ev.dir = 1; else if (tl.anim) ev.dir = Math.sign(tl.anim.to - tl.anim.from) || ev.dir;
  const want = clamp(tl.dragging ? Math.round(tl.idx) : ev.dir > 0 ? Math.ceil(tl.idx - .06) : Math.floor(tl.idx + .06), 0, LAST);
  if (want !== ev.shown) {
    ev.o -= dt / .2;
    if (ev.o <= 0) { ev.o = 0; ev.shown = want; ev.t0 = t; ev.has = fillCaption(want); }
  } else ev.o = Math.min(1, ev.o + dt / .38);
  const o = ev.has ? ease(ev.o) : 0, key = o.toFixed(2);
  if (uiCache.cap !== key) { uiCache.cap = key; capEl.style.opacity = key; capEl.style.transform = `translate(-50%,${((1 - o) * 7).toFixed(1)}px)`; }
  const hot = snaps[ev.shown].event;
  for (const c of cars) c.hot = c.id === hot ? ease(ev.o) : 0;
}

// tl.idx runs steadily along the timeline; the plan eases every car in and out of each snapshot.
// What the knob and the date show is eased the same way, so they rest and move with the cars.
const shownIdx = idx => { const i = Math.min(Math.floor(idx), LAST); return i + ease(idx - i); };
const idxOfShown = v => {           // the other way round, for the scrubber
  const i = Math.min(Math.floor(v), LAST), want = v - i;
  if (i >= LAST || want <= 0) return i;   // at a snapshot (the last one included): exactly there, never a hair past today
  let a = 0, b = 1;
  for (let n = 0; n < 24; n++) { const m = (a + b) / 2; if (ease(m) < want) a = m; else b = m; }
  return i + (a + b) / 2;
};
function animTo(to, dur) { tl.anim = { from: tl.idx, to, t0: performance.now(), dur }; }
const settle = () => { const to = Math.round(tl.idx); animTo(to, clamp(driveMs(tl.idx, to), 300, 3000)); };   // on to the nearest snapshot
function goTo(i, dur) {
  cancelReplay();
  i = clamp(i, 0, LAST);
  animTo(i, dur ?? clamp(driveMs(tl.idx, i), 500, 6000));
}
function stepAnim(now) {
  if (!tl.anim) return;
  const a = tl.anim;
  if (intro.p < 1) { a.t0 = now; return; }              // cut short on the grid: let the field get away first
  const p = clamp((now - a.t0) / a.dur, 0, 1);
  tl.idx = lerp(a.from, a.to, p);
  if (p >= 1) { tl.idx = a.to; tl.anim = null; }
}

/* ---------- replay: back to the first snapshot, lights, launch, then every snapshot in turn ---------- */
const SPEED = +query.get('speed') > 0 ? +query.get('speed') : +PLAYBACK.speed > 0 ? +PLAYBACK.speed : 1;
const DIP = 0.45;                   // seconds to fade to black (and back) around the jump to the grid
const replay = { on: false, t: 0, onGrid: false, plan: null };
const range = v => { const [a, b] = [].concat(v).map(Number); return [Math.max(0, a || 0), Math.max(a || 0, b ?? a ?? 0)]; };

// PLAYBACK → seconds per step. 'events': every step moves for as long as its cars need (see
// calmPace(); final once the step is planned, an estimate until then), then rests `hold[0]`.
// Otherwise each step gets a share of `length` (by calendar time or evenly), kept between shortest
// and longest move + hold; the factor is searched so the total hits `length`.
function buildPlan() {
  const [t0, t1] = range(PLAYBACK.transition), [h0, h1] = range(PLAYBACK.hold);
  // How busy a step is, 0…1: 1 from three overtakes up, or when a lab joins or leaves (that car has
  // the whole field to drive past).
  const busy = snaps.slice(1).map((s, k) => {
    const a = snaps[k], both = s.order.filter(id => id in a.gaps);
    let passes = both.length < s.order.length || both.length < a.order.length ? 3 : 0;
    both.forEach((p, i) => both.slice(i + 1).forEach(q => { if (a.gaps[p] > a.gaps[q]) passes++; }));
    return Math.min(1, passes / 3);
  });
  let steps;
  if (EVENTS) steps = busy.map((_, k) => ({ move: stepSecs(k), hold: h0, set: !!drive.plans[k + 1] }));
  else {
    const hi = Math.max(.2, t0 + h0, t1 + h1);
    const w = snaps.slice(1).map((s, k) => PLAYBACK.spacing === 'uniform' ? 1 : Math.max(1, s.time - snaps[k].time));
    const m0 = busy.map(v => lerp(t0, t1, v));             // the more overtaking in a step, the longer its transition
    const lo = k => Math.max(.2, m0[k] + h0);
    const sum = f => w.reduce((a, x, k) => a + clamp(f * x, lo(k), hi), 0);
    let a = 0, b = w.length ? hi / Math.min(...w) : 0;
    for (let n = 0; n < 50; n++) { const m = (a + b) / 2; if (sum(m) < PLAYBACK.length) a = m; else b = m; }
    steps = w.map((x, k) => { const s = clamp(b * x, lo(k), hi), move = Math.max(.1, clamp(s - h0, m0[k], t1)); return { move, hold: Math.max(0, s - move) }; });
  }
  const first = clamp(h0, .8, 1.6);                     // rest on the first standings after the launch
  const driving = steps.reduce((n, s) => n + s.move + s.hold, 0);
  return { steps, first, drive: driving, total: DIP * 2 + .2 + PLAYBACK.lights + PLAYBACK.launch + first + driving, speed: SPEED };
}
function toGrid() {                 // under the black: everything back to the start line
  tl.idx = 0; tl.anim = null; scroll = 0; setWorld(0); flames.length = 0;
  intro.p = intro.speedF = intro.hud = 0;
  for (const c of cars) c.on = false;                   // so each one is placed afresh, in its grid slot
}
function setCurtain(v) { v = clamp(v, 0, 1).toFixed(2); if (curtainEl.style.opacity !== v) curtainEl.style.opacity = v; }
function cancelReplay() { if (!replay.on) return; replay.on = false; setCurtain(0); }
function play() {
  if (LAST < 1) return;
  if (replay.on) { cancelReplay(); settle(); return; }                             // the same button pauses
  const from = tl.anim ? tl.anim.to : tl.idx;
  tl.anim = null; tl.dragging = false;
  replay.on = true; replay.t = 0; replay.onGrid = false; replay.plan = buildPlan();
  // At today: the whole season again, from the grid. Anywhere else: drive on from here.
  replay.resume = from < LAST - 1e-3;
  if (replay.resume) {
    tl.idx = from;
    const steps = replay.plan.steps, i = Math.floor(from);
    let off = 0;
    for (let k = 0; k <= i && k < steps.length; k++) {
      const st = steps[k];
      if (EVENTS && !st.set) { st.move = stepPlan(k).secs; st.set = true; }
      off += k < i ? st.move + st.hold : (from - i) * st.move;
    }
    replay.off = off;
  }
}
// Where the replay's drive is after r seconds of it: tl.idx along the steps. True once it is at today.
function driveTo(r) {
  const plan = replay.plan;
  tl.idx = 0;
  for (let i = 0; i < plan.steps.length && r > 0; i++) {
    const s = plan.steps[i];
    if (EVENTS && !s.set) { s.move = stepPlan(i).secs; s.set = true; }   // about to be driven: its plan is needed now anyway
    if (r < s.move) { tl.idx = i + r / s.move; return false; }
    tl.idx = i + 1; r -= s.move;
    if (r < s.hold) return false;
    r -= s.hold;
  }
  return r > 0;
}
function stepReplay(dt) {
  if (!replay.on) {                 // racing as normal; if a replay was cut short on the grid, roll off it
    for (const k of ['p', 'speedF', 'hud']) intro[k] = Math.min(1, intro[k] + dt * (k === 'p' ? .8 : 2.5));
    setLights(0);
    return;
  }
  const T = (replay.t += dt * SPEED), plan = replay.plan;
  if (replay.resume) {              // playing on from a point on the timeline: no grid, no lights
    for (const k of ['p', 'speedF', 'hud']) intro[k] = Math.min(1, intro[k] + dt * (k === 'p' ? .8 : 2.5));
    setLights(0);
    if (driveTo(replay.off + T)) { replay.on = false; tl.idx = LAST; }
    return;
  }
  setCurtain(T < DIP ? T / DIP : 1 - (T - DIP) / DIP);
  if (T < DIP) return;
  if (!replay.onGrid) { replay.onGrid = true; toGrid(); }
  const k = T - DIP - .2;           // let the picture come back before the first light
  setIntro(Math.max(0, k));

scrub.addEventListener('input', () => { cancelReplay(); tl.anim = null; tl.dragging = true; tl.idx = idxOfShown(posToIdx(scrub.value / 1000)); });
const release = () => { if (!tl.dragging) return; tl.dragging = false; settle(); };
scrub.addEventListener('change', release);
scrub.addEventListener('pointerup', release);
scrub.addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) e.preventDefault(); });
playBtn.addEventListener('click', play);
addEventListener('keydown', e => {
  if (LAST < 1) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') goTo(Math.ceil(tl.idx - 1e-3) - 1);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') goTo(Math.floor(tl.idx + 1e-3) + 1);
  else if (e.key === ' ' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); play(); }
});

let uiCache = {};
function syncTimelineUI() {
  const shown = shownIdx(tl.idx), pos = idxToPos(shown), near = Math.round(tl.idx), dist = Math.abs(tl.idx - near);
  if (!tl.dragging) scrub.value = Math.round(pos * 1000);
  knob.style.left = fill.style.width = (pos * 100).toFixed(2) + '%';
  const d = new Date(timeAt(shown));

  if (uiCache.date !== date) dateEl.innerHTML = uiCache.date = date;
  if (uiCache.near !== near) {
    uiCache.near = near; L.lh = 0;
    headEl.textContent = snaps[near].headline || '';
    demoEl.hidden = !snaps[near].demo;
    ticks.forEach((k, n) => { k.b.classList.toggle('on', n === near); k.tk.classList.toggle('on', n === near); });
  }

  if (uiCache.playing !== replay.on) playBtn.classList.toggle('playing', uiCache.playing = replay.on);
  const atEnd = !tl.dragging && (tl.anim ? tl.anim.to : tl.idx) >= LAST - 1e-3;
  const label = replay.on ? 'Pause' : atEnd ? 'Replay the season' : 'Play from here';
  if (uiCache.atEnd !== atEnd) playBtn.classList.toggle('atend', uiCache.atEnd = atEnd);

/* ---------- life: how far a car may move about ----------
   A car with empty road around it drifts DRIFT across the road and surges SURGE along it (car
   units: a car is 100 long, 46 wide), and turns its nose up to TURN_FREE. Next to another car that
   is cut back, pair by pair, by one rule: the plan keeps two cars clear of each other either across
   the road or along it, and in that direction the two share what is left of the gap once
   TUNING.clearance and the room their turned noses take are set aside. Half each. So if both lean
   towards each other at the same moment, with their noses turned, `clearance` is still there.
   The other direction stays free: two cars side by side still surge past each other's doors.
   Everything here follows from where the plan puts the cars, so it is as repeatable as the plan,
   and frontierLap.check() measures the worst case over the whole timeline.

const DRIFT = 3, SURGE = 9, KERB_PLAY = 3;
const TURN_TIGHT = .03, TURN_FREE = .09;                // radians

const BLEND = .5;
function elbowRoom(list, w) {       // list: cars with x and by. Sets on each: sx, sy (0…1 of DRIFT and SURGE) and fr (0…1 from TURN_TIGHT to TURN_FREE)
  const u = L.carLen / 100, AX = Math.max(1e-3, DRIFT * u * w), AY = Math.max(1e-3, SURGE * u * w), clr = Math.max(0, +TUNING.clearance || 0) * L.carLen;
  const rx = L.carLen * TURN_TIGHT, ry = L.carW * TURN_TIGHT, rxf = L.carLen * (TURN_FREE - TURN_TIGHT), ryf = L.carW * (TURN_FREE - TURN_TIGHT);
  for (const c of list) { c.sx = clamp((L.xpin + KERB_PLAY * u - Math.abs(c.x)) / AX, 0, 1); c.sy = c.fr = 1; }   // the kerb is as far out as anyone goes
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j];
    const gx = Math.abs(a.x - b.x) - L.carW - clr - rx, gy = Math.abs(a.by - b.by) - L.carLen - clr - ry;   // what the two have to share
    if (gx >= 2 * AX + rxf || gy >= 2 * AY + ryf) continue;                                                // nowhere near each other
    const tx = clamp(gx / (2 * AX), 0, 1), ty = clamp(gy / (2 * AY), 0, 1);
    // Clear along the road by more than across it: the surge is what gets shared, the drift is
    // let go again the clearer they are. And the other way round. Where the two are equal both
    // are held, so nothing jumps when a car comes alongside.
    let cx = tx, cy = ty;
    if (ty >= tx) { if (tx < 1) cx = tx + (1 - tx) * smooth(0, BLEND * (1 - tx), ty - tx); }
    else cy = ty + (1 - ty) * smooth(0, BLEND * (1 - ty), tx - ty);
    const fr = Math.max(clamp((gx - 2 * AX) / rxf, 0, 1), clamp((gy - 2 * AY) / ryf, 0, 1));
    a.sx = Math.min(a.sx, cx); b.sx = Math.min(b.sx, cx); a.sy = Math.min(a.sy, cy); b.sy = Math.min(b.sy, cy); a.fr = Math.min(a.fr, fr); b.fr = Math.min(b.fr, fr);
  }
}
// Now and then a car has a look at the one ahead: a quick dart forward, an easy drop back (one in
// four times it lifts instead). 0 between looks, up to 1 at the height of one.
const LUNGE = 2.3;                  // seconds a look takes
function lunge(c, tw) {
  const v = tw / c.every + c.ph[5], n = Math.floor(v), q = ((v - n) * c.every - hash(c.seed, n, 7) * (c.every - LUNGE)) / LUNGE;
  if (q <= 0 || q >= 1) return 0;
  const s = Math.sin(Math.PI * Math.pow(q, .62));
  return s * s * (hash(c.seed, n, 9) < .25 ? -.7 : 1);
}

/* ---------- simulation ---------- */
function updateCars(t, dt) {
  // 1. Where the drive plan puts every car at this point of the timeline. At a snapshot that is
  //    its hold; between two it is the step from one to the other; a replay starts with the step
  //    off the grid. A lab only in the earlier snapshot is retiring, one only in the later is joining.
  const i = clamp(Math.floor(tl.idx), 0, LAST), f = i >= LAST ? 0 : tl.idx - i, hold = drive.holds[i];
  const launching = intro.p < 1 && !tl.idx;
  const st = launching ? stepPlan(-1) : f > 0 ? stepPlan(i) : null, F = launching ? intro.p : f;
  // px → seconds, for the gap numbers: the snapshot's own map at rest, the two blended on the way
  const blend = ease(f), sec = st && !launching ? y => lerp(secAt(st.A.map, y - L.top), secAt(st.B.map, y - L.top), blend) : y => secAt(hold.map, y - L.top);
  const act = [];
  for (const c of cars) {
    const p = st ? st.car[c.id] : null, was = c.on;
    c.on = st ? !!p : c.id in hold.y;
    if (!c.on) { c.ghost = 0; c.ahead = null; c.by = 1e5; c.wx = c.wy = 0; continue; }
    c.ghost = p ? p.ghost : 0;
    c.x = p ? xAt(p, F) : hold.x[c.id];
    c.by = p ? yAt(p, F) : hold.y[c.id];
    c.lane = p ? (F < .5 ? p.sideA : p.sideB) : hold.side[c.id];   // which side its label is on: as in the snapshot the labels describe
    if (intro.p < 1 && !launching && c.id in drive.grid.y) {       // a replay cut short on the grid by a jump elsewhere: roll off it
      const g = ease(intro.p); c.x = lerp(drive.grid.x[c.id], c.x, g); c.by = lerp(drive.grid.y[c.id], c.by, g);
    }
    if (!was) { c.px = c.x; c.vx = c.ly = c.wvx = c.wvy = 0; c.wx = c.wy = NaN; c.side = c.lane; L.lh = 0; }   // just arrived: its label has been filled in, measure the labels again
    act.push(c);
  }

  // 2. Places and gaps, read off the road: whoever's nose is ahead is ahead.
  act.sort((a, b) => a.by - b.by || a.rank - b.rank);
  let prev = null;
  act.forEach((c, r) => {
    c.rank = r; c.sec = sec(c.by); c.gap = c.sec - act[0].sec;
    // intervals are between classified cars: one that is arriving or retiring isn't measured against
    if (c.ghost) { c.ahead = null; c.int = 0; } else { c.ahead = prev; c.int = prev ? c.sec - prev.sec : 0; prev = c; }
  });

  // 3. Life on top: drift, surge, a look at the car ahead, a turn of the nose into every move.
  //    All of it inside the room the plan keeps, see elbowRoom().
  const u = L.carLen / 100, w = (reduced ? 0 : Math.max(0, +TUNING.wobble || 0)) * intro.speedF, tw = t * (+TUNING.pace > 0 ? +TUNING.pace : 1);
  elbowRoom(act, w);
  for (const c of act) {
    const p = c.ph, q = c.fq;
    c.side += (c.lane - c.side) * (1 - Math.exp(-dt * 7));
    c.vx = lerp(c.vx, (c.x - c.px) / Math.max(dt, .001), .18); c.px = c.x;
    // three unhurried waves each way, never in step with another car's; along the road a lunge joins them
    // sideways only a slow sway: a fast car doesn't shake across the road, it holds its line
    const nx = .7 * Math.sin(tw * .61 * q[0] + p[0]) + .3 * Math.sin(tw * 1.37 * q[1] + p[1]);
    const ny = .42 * Math.sin(tw * .71 * q[3] + p[3]) + .25 * Math.sin(tw * 1.83 * q[4] + p[4]) - .33 * lunge(c, tw);
    const wx = nx * c.sx * DRIFT * u * w, wy = ny * c.sy * SURGE * u * w;
    if (c.wx !== c.wx) { c.wx = wx; c.wy = wy; }           // just arrived: nothing to compare with yet
    c.wvx = lerp(c.wvx, (wx - c.wx) / dt, .3); c.wvy = lerp(c.wvy, (wy - c.wy) / dt, .3);
    c.wx = wx; c.wy = wy;
    // the nose turns into a lane change, as far as the room allows and never with a jolt; the sway
    // barely turns it, as at speed (heading = sideways speed / road speed)
    const lim = lerp(TURN_TIGHT, TURN_FREE, c.fr);
    c.rot = lim * Math.tanh((c.vx * .003 + c.wvx * .0008) / u / lim);
    // flames on the overrun, now and then
    if (TUNING.flames && !reduced && intro.speedF > .95 && c.by < H) {
      if (c.ghost > 0 && Math.abs(c.x) > L.dx * 1.15) c.flameEnd = t + .08;   // a newcomer charging up the kerb spits them all the way
      if (t > c.flameAt) { c.flameEnd = t + .22 + Math.random() * .3; c.flameAt = t + 3.5 + Math.random() * 8; }
      if (t < c.flameEnd) emitFlames(c);
    }
  }
  for (let n = flames.length - 1; n >= 0; n--) { const s = flames[n]; s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; if (s.life > s.max) flames.splice(n, 1); }
}

/* ---------- drawing ---------- */
function draw(t) {
  const { cx, roadHalf, kerbW, carLen, carW } = L;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const rl = cx - roadHalf, rw = roadHalf * 2;

  // grass, with mowing bands rolling by
  for (let y = (scroll % 512) - 512; y < H; y += 512) for (let x = (cx % 512) - 512; x < W; x += 512) ctx.drawImage(grass, x, y);
  const band = 170;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  for (let y = (scroll % (band * 2)) - band * 2; y < H; y += band * 2) ctx.fillRect(0, y, W, band);

  // run-off, barriers, grandstands, trees: the world beside the road
  drawTrackside(t);

  // verge + asphalt
  ctx.fillStyle = '#0a1a13'; ctx.fillRect(rl - kerbW - 9, 0, rw + kerbW * 2 + 18, H);
  ctx.save(); ctx.beginPath(); ctx.rect(rl, 0, rw, H); ctx.clip();
  for (let y = (scroll % 512) - 512; y < H; y += 512) for (let x = rl; x < rl + rw; x += 256) ctx.drawImage(asphalt, x, y);
  // rubbered-in racing lines
  const rg = ctx.createLinearGradient(rl, 0, rl + rw, 0);
  rg.addColorStop(0, 'rgba(255,255,255,.05)'); rg.addColorStop(.3, 'rgba(0,0,0,.24)'); rg.addColorStop(.5, 'rgba(0,0,0,.1)'); rg.addColorStop(.7, 'rgba(0,0,0,.24)'); rg.addColorStop(1, 'rgba(255,255,255,.05)');
  ctx.fillStyle = rg; ctx.fillRect(rl, 0, rw, H);
  // tarmac seams
  for (let y = (scroll % 430) - 430; y < H; y += 430) { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(rl, y, rw, 2); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fillRect(rl, y + 2, rw, 1); }
  // skid marks
  const cell = 640;
  ctx.lineCap = 'round'; ctx.lineWidth = carW * .15; ctx.strokeStyle = 'rgba(6,6,8,.3)';
  for (let k = Math.floor((scroll - H) / cell) - 1; k <= Math.floor(scroll / cell) + 1; k++) {
    if (k < 1) continue;
    const r = rng(k), n = r() < .8 ? 1 + (r() < .35) : 0, topY = scroll - (k + 1) * cell;
    for (let m = 0; m < n; m++) {
      const x0 = cx + (r() * 2 - 1) * roadHalf * .62, y0 = topY + r() * cell, len = 150 + r() * 280, bend = (r() * 2 - 1) * 26, sep = carW * .72;
      for (const dx of [-sep / 2, sep / 2]) { ctx.beginPath(); ctx.moveTo(x0 + dx, y0); ctx.quadraticCurveTo(x0 + dx + bend, y0 + len / 2, x0 + dx + bend * 1.7, y0 + len); ctx.stroke(); }
    }
  }
  // the grid we launched from, and the start line each time it comes round again
  const lap = Math.round(world / LAP);
  for (let n = Math.max(0, lap - 1); n <= lap + 1; n++) {
    const dy = L.gridTop + (world - plan(n).drs) * L.S;                 // DRS detection line
    if (dy > -10 && dy < H + 10) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(rl, dy, rw, 3); }
    const gy = L.gridTop + (world - n * LAP) * L.S;
    if (gy < -400 || gy > H + 400) continue;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    const sq = rw / 16;
    for (let r2 = 0; r2 < 2; r2++) for (let q = 0; q < 16; q++) if ((q + r2) % 2 === 0) ctx.fillRect(rl + q * sq, gy - 22 + r2 * sq - sq, sq, sq);
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    for (const c of cars) {
      if (c.gridSlot < 0) continue;
      const x = cx + (c.gridSlot % 2 ? 1 : -1) * L.dx / 2, y = gy + c.gridSlot * carLen * GRID_ROW - 5, hw = carW * .58;
      ctx.beginPath(); ctx.moveTo(x - hw, y + 16); ctx.lineTo(x - hw, y); ctx.lineTo(x + hw, y); ctx.lineTo(x + hw, y + 16); ctx.stroke();
    }
  }
  ctx.restore();

  // edge lines + kerbs
  ctx.fillStyle = 'rgba(240,240,236,.82)'; ctx.fillRect(rl + 3, 0, 2.5, H); ctx.fillRect(rl + rw - 5.5, 0, 2.5, H);
  const bl = L.mobile ? 26 : 34;
  for (let y = (scroll % (bl * 2)) - bl * 2; y < H; y += bl * 2) {
    ctx.fillStyle = '#d6232b'; ctx.fillRect(rl - kerbW, y, kerbW, bl); ctx.fillRect(rl + rw, y + bl, kerbW, bl);
    ctx.fillStyle = '#eceae4'; ctx.fillRect(rl - kerbW, y + bl, kerbW, bl); ctx.fillRect(rl + rw, y, kerbW, bl);
  }
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(rl - kerbW, 0, 2, H); ctx.fillRect(rl + rw + kerbW - 2, 0, 2, H);
  // where the pit lane leaves and rejoins, it cuts through the kerb
  for (const s of streams['R-in'].segs) {
    if (s.type !== 'pit') continue;
    const Y = p => L.gridTop + (world - p) * L.S;
    for (const [p0, p1] of [[s.a, s.a + 300], [s.b - 300, s.b]]) {
      if (Y(p0) < 0 || Y(p1) > H) continue;
      ctx.save(); ctx.beginPath(); ctx.rect(cx + roadHalf - 2, Y(p1), kerbW + 12, Y(p0) - Y(p1)); ctx.clip();
      pitPath(s, Y); ctx.fillStyle = '#212329'; ctx.fill(); ctx.restore();
    }
  }

  // floodlight pool, and the pools under the trackside masts
  const fl = ctx.createRadialGradient(cx, H * .42, 0, cx, H * .42, Math.max(H * .62, 380));
  fl.addColorStop(0, 'rgba(255,244,224,.085)'); fl.addColorStop(1, 'rgba(255,244,224,0)');
  ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r] of glows) { const q = r * L.S; if (y > -q && y < H + q) ctx.drawImage(SC.pool, x - q, y - q, q * 2, q * 2); }
  // where scenery has to share the side with the labels, each label gets a darker plate
  if (L.dim) for (const c of cars) for (const [o, x0, x1] of [[c.oL, cx - L.edge, cx - L.edge - L.lw], [c.oR, cx + L.edge, cx + L.edge + L.lw]]) {
    if (o < .01 || !c.lh) continue;
    const pg = ctx.createLinearGradient(x0, 0, x1, 0);           // solid by the road, easing off outwards, like the label's own backdrop
    pg.addColorStop(0, `rgba(7,9,11,${(.86 * o).toFixed(3)})`); pg.addColorStop(.7, `rgba(7,9,11,${(.8 * o).toFixed(3)})`); pg.addColorStop(1, `rgba(7,9,11,${(.5 * o).toFixed(3)})`);
    ctx.fillStyle = pg; ctx.fillRect(Math.min(x0, x1), c.by - 1 + (c.ly || 0), L.lw, c.lh);
  }

  drawBeams(t);

  // ---- timing graphics ----
  const hud = intro.hud;
  if (hud > .01) {
    // nose lines: where each car "is"
    for (const c of cars) {
      if (c.by > H) continue;
      ctx.strokeStyle = rgba(c.tint, .2 * hud); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(rl + 6, c.by); ctx.lineTo(rl + rw - 6, c.by); ctx.stroke();
      const aL = clamp((-c.side - .15) / .7, 0, 1), aR = clamp((c.side - .15) / .7, 0, 1);
      ctx.lineWidth = 2;
      if (aL > 0) { ctx.strokeStyle = rgba(c.tint, .85 * hud * aL); ctx.beginPath(); ctx.moveTo(cx + c.x, c.by); ctx.lineTo(cx - L.edge, c.by); ctx.stroke(); }
      if (aR > 0) { ctx.strokeStyle = rgba(c.tint, .85 * hud * aR); ctx.beginPath(); ctx.moveTo(cx + c.x, c.by); ctx.lineTo(cx + L.edge, c.by); ctx.stroke(); }
    }
  }

  // exhaust flames
  if (flames.length) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for (const s of flames) {
      ctx.lineWidth = s.w; ctx.strokeStyle = s.col(1 - s.life / s.max);
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * s.tail, s.y - s.vy * s.tail); ctx.stroke();
    }
    ctx.restore();
  }

  // The car this step is about: a pool of its own colour on the road under it, breathing slowly,
  // and one ring going out from it as the step begins.
  for (const c of cars) {
    if (c.hot < .01 || c.by > H + 40) continue;
    const age = t - ev.t0, breath = reduced ? .85 : .8 + .2 * Math.sin(age * 2.1);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.translate(cx + c.x + c.wx, c.by + c.wy + carLen / 2); ctx.rotate(c.rot);
    ctx.save(); ctx.scale(carW * 1.5, carLen * .92);
    const pool = ctx.createRadialGradient(0, 0, .3, 0, 0, 1);
    pool.addColorStop(0, rgba(c.tint, .6 * c.hot * breath)); pool.addColorStop(.55, rgba(c.tint, .24 * c.hot * breath)); pool.addColorStop(1, rgba(c.tint, 0));
    ctx.fillStyle = pool; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
    const ring = age / 1.25;
    if (ring < 1 && !reduced) {
      const g = easeOut(ring);
      ctx.strokeStyle = rgba(c.tint, .7 * c.hot * (1 - ring) * (1 - ring)); ctx.lineWidth = 2.5 - 1.5 * g;
      ctx.beginPath(); ctx.ellipse(0, 0, carW * (.72 + .85 * g), carLen * (.6 + .5 * g), 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }

  // cars, back of the field first
  for (const c of cars.slice().sort((a, b) => b.by - a.by)) {
    if (c.by > H + 40) continue;
    ctx.save();
    ctx.translate(cx + c.x + c.wx, c.by + c.wy + carLen / 2);
    ctx.rotate(c.rot);
    ctx.drawImage(c.sprite, -c.sw / 2, -c.sh / 2, c.sw, c.sh);
    liveCar(c, t, carLen / 100);
    ctx.restore();
  }

  // gantries and bridges pass over the cars
  drawOverhead();

  // header / footer shade + vignette
  let sh = ctx.createLinearGradient(0, 0, 0, 150);
  sh.addColorStop(0, 'rgba(8,10,12,.82)'); sh.addColorStop(1, 'rgba(8,10,12,0)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, W, 150);
  for (const b of L.corners) {                     // a little extra night behind the wordmark and the date, now that things pass under them
    const rx = b.width * .5 + 70, ry = b.height * .5 + 46;
    ctx.save(); ctx.translate(b.left + b.width / 2, b.top + b.height / 2); ctx.scale(rx, ry);
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); cg.addColorStop(0, 'rgba(8,10,12,.72)'); cg.addColorStop(.55, 'rgba(8,10,12,.6)'); cg.addColorStop(1, 'rgba(8,10,12,0)');
    ctx.fillStyle = cg; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
  }
  sh = ctx.createLinearGradient(0, H - 150, 0, H);
  sh.addColorStop(0, 'rgba(8,10,12,0)'); sh.addColorStop(.72, 'rgba(8,10,12,.8)'); sh.addColorStop(1, 'rgba(8,10,12,.92)');
  ctx.fillStyle = sh; ctx.fillRect(0, H - 150, W, 150);
  const vg = ctx.createRadialGradient(cx, H / 2, Math.min(W, H) * .35, cx, H / 2, Math.hypot(W, H) * .56);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function updateLabels() {
  const near = Math.round(tl.idx), dist = Math.abs(tl.idx - near), snap = snaps[near];
  // the notes belong to the nearest snapshot: half way between two they change, in a short dip
  const noteO = (1 - smooth(.3, .47, dist)).toFixed(2), now = timeAt(tl.idx), joining = snaps[Math.min(LAST, Math.ceil(tl.idx))];
  for (const c of cars) {
    if (!c.on) { c.oL = c.oR = 0; continue; }
    // a lab on its way in has only one thing to say: the note of the snapshot it is joining
    const e = snap.entry[c.id] || (c.ghost > 0 && joining.entry[c.id]) || {}, who = whoIs(c, now, e);
    useLogo(c, who.logo);
    setText(c, 'pos', 'P' + (c.rank + 1));
    setText(c, 'name', who.name);
    setText(c, 'note', USING_RACE ? '' : c.ghost < 0 ? 'Drops out of the fight.' : e.note || '');
    setText(c, 'el:gone', c.ghost < 0);
    // a car that is arriving or leaving brings its label in and out with it
    const vis = intro.hud * (1 - smooth(L.bottom - L.carLen * .5, L.bottom + 24, c.by));
    c.oL = clamp((-c.side - .15) / .7, 0, 1) * vis; c.oR = clamp((c.side - .15) / .7, 0, 1) * vis;
  }
  // Two labels on the same side never sit on top of each other: going down the road each one
  // slides below the one before it, then anything that ran past the bottom is pushed back up.
  if (!L.lh) L.lh = Math.max(...cars.map(c => c.lh = c.els.left.el.offsetHeight)) + 6;
  for (const key of ['oL', 'oR']) {
    const col = cars.filter(c => c[key] > .5).sort((a, b) => a.by - b.by);
    let edge = -1e9;
    for (const c of col) { c.push = Math.max(0, edge - c.by); edge = c.by + c.push + L.lh; }
    edge = L.labelEnd;
    for (let k = col.length - 1; k >= 0; k--) { const c = col[k]; c.push = Math.min(c.push, edge - L.lh - c.by); edge = c.by + c.push; }
  }
  // Each label eases to its place. One next to a car that is moving fast would lag behind and
  // slide over the label above it, so that is ruled out afterwards: it is held clear instead.
  for (const c of cars) if (c.on) c.ly = lerp(c.ly || 0, c.push || 0, .18);
  for (const key of ['oL', 'oR']) {
    let edge = -1e9;
    for (const c of cars.filter(c => c.on && c[key] > .5).sort((a, b) => a.by - b.by)) { c.ly = Math.max(c.ly, edge - c.by); edge = c.by + c.ly + L.lh; }
  }
  for (const c of cars) {
    const l = c.els.left, r = c.els.right;
    if (!c.on) { if (c.cache.vis !== 0) { c.cache.vis = 0; l.el.style.opacity = r.el.style.opacity = 0; } continue; }
    c.cache.vis = 1;
    const y = (c.by - 1 + c.ly).toFixed(1);
    l.el.style.opacity = c.oL.toFixed(2); r.el.style.opacity = c.oR.toFixed(2);
    l.el.style.transform = `translate(${(L.cx - L.edge - L.lw).toFixed(1)}px,${y}px)`;
    r.el.style.transform = `translate(${(L.cx + L.edge).toFixed(1)}px,${y}px)`;
    const no = c.ghost ? '1' : noteO, hot = c.hot.toFixed(2);
    if (c.cache.no !== no) l.note.style.opacity = r.note.style.opacity = c.cache.no = no;
    if (c.cache.hot !== hot) { c.cache.hot = hot; l.el.style.setProperty('--hot', hot); r.el.style.setProperty('--hot', hot); }
  }
}

/* ---------- main loop ---------- */
function frame(now) {
  const t = now / 1000, dt = Math.min(.05, Math.max(.001, t - last)); last = t;
  stepReplay(dt);
  stepAnim(now);
  const step = roadSpeed() * (reduced ? .35 : 1) * intro.speedF * dt;
  scroll += step; world += step / L.S;
  updateCars(t, dt);
  syncEvent(t, dt);
  draw(t);
  updateLabels();
  syncTimelineUI();
  requestAnimationFrame(frame);
}

// Page load: no lights, no launch. The field is already racing in the latest standings.
layout();
updateCars(0, .05);
for (const c of cars) c.side = c.lane;
let resizing = 0;
addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(layout, 90); });
// The real fonts set the labels, the dates under the timeline and the caption a little differently.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { L.lh = 0; if (measureCaption() !== L.capH) layout(); else thinTicks(); });
document.body.classList.add('live');
last = performance.now() / 1000;
requestAnimationFrame(frame);

// A handle for the console: frontierLap.goTo(0), frontierLap.play(), frontierLap.plan(), frontierLap.check(),
// frontierLap.idx = 1.5, frontierLap.world += 5000 (skip ahead along the lap, in car units)
window.frontierLap = {
  goTo, play, cars, snaps, labs, PLAYBACK, TUNING, problems,
  plan() { snaps.forEach((_, k) => stepPlan(k - 1)); const p = buildPlan(); console.table(p.steps.map((s, i) => ({ to: snaps[i + 1].date, move: +s.move.toFixed(2), hold: +s.hold.toFixed(2) }))); return p; },
  // The drive plan, measured. Per step: the least room between two cars side by side and nose to tail as
  // planned (px, before wobble), how many samples broke the gaps (should be 0), which cars had to be
  // retimed, and `worst`: the least room left between two cars at any sample once every car leans as far
  // towards its neighbours as elbowRoom() lets it, noses turned. That should never be under `clearance`.
  // Also per step: the seconds its move takes and the fastest any car goes in it, along the road and
  // across it (px per second, as planned, without the wobble). `opened`: see TUNING.zoom.
  check() {
    const u = L.carLen / 100, w = Math.max(0, +TUNING.wobble || 0), clearance = Math.max(0, +TUNING.clearance || 0) * L.carLen;
    const rows = snaps.map((_, k) => stepPlan(k - 1)).map((st, k) => {
      let worst = Infinity;
      for (let n = 0; n <= NS; n++) {
        const list = st.cs.map(c => ({ x: c.xs[n], by: c.ys[n] }));
        elbowRoom(list, w);
        for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
          const a = list[i], b = list[j]; if (a.by >= H || b.by >= H) continue;
          const turn = lerp(TURN_TIGHT, TURN_FREE, a.fr) + lerp(TURN_TIGHT, TURN_FREE, b.fr);
          worst = Math.min(worst, Math.max(Math.abs(a.x - b.x) - L.carW - (a.sx + b.sx) * DRIFT * u * w - L.carLen / 2 * turn,
            Math.abs(a.by - b.by) - L.carLen - (a.sy + b.sy) * SURGE * u * w - L.carW / 2 * turn));
        }
      }
      return { step: k ? `${snaps[k - 1].date} → ${snaps[k].date}` : 'grid → ' + snaps[0].date, tight: st.tight, sideRoom: +st.sideRoom.toFixed(1), noseRoom: +st.noseRoom.toFixed(1), worst: +worst.toFixed(1),
        secs: +st.secs.toFixed(2), along: Math.round(st.along), across: Math.round(st.across), retimed: st.retimed.join(', ') };
    });
    console.table(rows);
    const worst = Math.min(...rows.map(r => r.worst)), moves = rows.slice(1);
    // snapshots whose tightest pack of four had to be opened up to seat it: by how much, and how far the rest closed up
    const opened = snaps.map((s, i) => ({ snapshot: s.date, pack: +L.maps[i].open.toFixed(2), rest: +L.maps[i].shrink.toFixed(2) })).filter(o => o.pack > 1.005);
    return { ok: rows.every(r => !r.tight) && worst >= clearance - .6, carLen: L.carLen, carW: L.carW, sideGap: L.dx - L.carW, noseGap: L.dy - L.carLen, clearance, worst,
      topSpeed: Math.max(...moves.map(r => r.along)), sideSpeed: Math.max(...moves.map(r => r.across)), limits: drive.calm, opened, steps: rows };
  },
  get idx() { return tl.idx; }, set idx(v) { cancelReplay(); tl.anim = null; tl.idx = clamp(+v || 0, 0, LAST); },
  get replaying() { return replay.on; }, get layout() { return L; }, get intro() { return intro; }, get drive() { return drive; },
  get world() { return world; }, set world(v) { setWorld(v); },
};
})();
</script>
