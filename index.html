<title>Fastest Lab · the AI model grand prix</title>
<meta name="description" content="Who has the best AI model lineup right now? The labs as race cars, the gaps as the message. One opinion, zero benchmarks.">

<style>
  :root {
    --bg: #0b0d10;
    --ink: #f4f5f7;
    --mute: #98a0aa;
    --purple: #b65cff;   /* timing-screen purple: fastest of all */
    --green: #2ee57a;    /* timing-screen green */
    --yellow: #ffd23f;
    --font: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { touch-action: manipulation; }
  #track { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- wordmark ---------- */
  #brand { position: fixed; z-index: 5; left: max(16px, 2.5vw); top: max(14px, 2.4vh); }
  #brand h1 { margin: 0; font: italic 800 clamp(34px, 4.3vw, 58px)/.86 var(--font); letter-spacing: .005em; text-transform: uppercase; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  #brand h1 em { font-style: inherit; color: var(--purple); }
  #brand .sectors { display: flex; gap: 4px; margin: 9px 0 8px 2px; }
  #brand .sectors i { width: 30px; height: 4px; transform: skewX(-24deg); background: var(--purple); }
  #brand .sectors i:nth-child(2) { background: var(--green); }
  #brand .sectors i:nth-child(3) { background: var(--yellow); }
  #brand p { margin: 0; font: 600 clamp(11px, 1vw, 14px)/1.2 var(--font); letter-spacing: .17em; text-transform: uppercase; color: var(--mute); }

  /* ---------- date stamp + start lights ---------- */
  #stamp { position: fixed; z-index: 5; right: max(16px, 2.5vw); top: max(16px, 2.6vh); text-align: right; }
  #stamp .lights { display: inline-flex; gap: 5px; padding: 5px 7px; border-radius: 9px; background: rgba(5,6,8,.8); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  #stamp .lights i { width: 10px; height: 10px; border-radius: 50%; background: #2a1214; transition: background .08s, box-shadow .08s; }
  #stamp .lights i.on { background: #ff2a1f; box-shadow: 0 0 10px 2px rgba(255,42,31,.75); }
  #stamp .date { margin-top: 8px; font: italic 700 clamp(22px, 2.5vw, 34px)/1 var(--font); letter-spacing: .03em; font-variant-numeric: tabular-nums; }
  #stamp .headline { margin-top: 5px; font: 600 clamp(11px, 1vw, 14px)/1.2 var(--font); letter-spacing: .15em; text-transform: uppercase; color: var(--mute); transition: opacity .25s; }
  #stamp .demo[hidden] { display: none; }
  #stamp .demo { display: inline-block; margin-top: 6px; font: 600 10px/1 var(--font); letter-spacing: .16em; text-transform: uppercase; color: var(--yellow); border: 1px solid rgba(255,210,63,.45); border-radius: 3px; padding: 3px 5px 2px; transition: opacity .25s; }

  /* ---------- car labels ---------- */
  #labels { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; width: var(--lw); padding: 8px 0 6px 12px; opacity: 0; will-change: transform, opacity;
    background: linear-gradient(90deg, rgba(7,9,11,.8), rgba(7,9,11,.45) 55%, rgba(7,9,11,0));
    border-top: 2px solid; border-image: linear-gradient(90deg, var(--tint), transparent 94%) 1; }
  .label.left { padding: 8px 12px 6px 0; text-align: right;
    background: linear-gradient(270deg, rgba(7,9,11,.8), rgba(7,9,11,.45) 55%, rgba(7,9,11,0));
    border-image: linear-gradient(270deg, var(--tint), transparent 94%) 1; }
  .r1 { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .r2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; font: 600 17px/1 var(--font); letter-spacing: .04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .left .r1, .left .r2 { flex-direction: row-reverse; }
  .pos { font: italic 800 34px/1 var(--font); color: var(--tint); }
  .badge { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--bbg); display: grid; place-items: center; box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); }
  .badge svg { display: block; width: calc(var(--ls, .7) * 100%); height: calc(var(--ls, .7) * 100%); }
  .name { font: italic 700 28px/1 var(--font); text-transform: uppercase; letter-spacing: .01em; }
  .int { color: var(--mute); font-size: 13px; letter-spacing: .1em; }
  .chip { display: none; font: 700 11px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; padding: 3px 6px 2px; border-radius: 3px; }
  .chip.on { display: inline-block; }
  .chip.drs { background: var(--green); color: #03140a; }
  .chip.fl { background: var(--purple); color: #fff; }
  .chip.io { background: var(--yellow); color: #1a1400; }
  .r3 { margin-top: 7px; font: 400 13px/1.3 var(--body); color: #c9ced5; }
  .r3 b { font: 600 12px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .r3 b::after { content: ' / '; opacity: .5; }
  /* a crowded field: labels drop the note line so every car keeps its name */
  .dense .r3, .dense .int { display: none; }
  @media (min-width: 641px) { .dense .pos { font-size: 28px; } .dense .name { font-size: 23px; } }

  /* ---------- replay: a quick dip to black while everything goes back to the grid ---------- */
  #curtain { position: fixed; inset: 0; z-index: 4; background: var(--bg); opacity: 0; pointer-events: none; }

  /* ---------- timeline ---------- */
  #deck { position: fixed; z-index: 5; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(580px, calc(100% - 28px)); display: flex; gap: 16px; align-items: flex-start; padding-right: 26px;
    opacity: 0; transition: opacity .6s; }
  body.live #deck { opacity: 1; }
  #play { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.24); background: rgba(12,14,18,.72); color: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: border-color .15s, background .15s; }
  #play:hover { border-color: var(--purple); background: rgba(182,92,255,.18); }
  #play svg { width: 14px; height: 14px; fill: currentColor; }
  #play .pause { display: none; }
  #play.playing .pause { display: block; }
  #play.playing .go { display: none; }
  #tl { position: relative; flex: 1; height: 62px; }
  #tl .rail { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.17); }
  #tl .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, rgba(182,92,255,.15), var(--purple)); }
  #tl .tk { position: absolute; top: 9px; width: 2px; height: 22px; margin-left: -1px; background: rgba(255,255,255,.4); }
  #tl .tick { position: absolute; top: 35px; transform: translateX(-50%); background: none; border: 0; padding: 4px 8px 6px; color: var(--mute); font: 600 13px/1 var(--font); letter-spacing: .15em; white-space: nowrap; cursor: pointer; z-index: 5; transition: color .15s; }
  #tl .tick:hover, #tl .tick.on { color: #fff; }
  #tl .tick.mute { visibility: hidden; }
  #tl .tick:focus-visible, #play:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  #tl .knob { position: absolute; top: 20px; left: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(182,92,255,.4), 0 2px 12px rgba(0,0,0,.7); pointer-events: none; z-index: 2; }
  #scrub { position: absolute; left: -12px; top: 3px; width: calc(100% + 24px); height: 34px; margin: 0; opacity: 0; cursor: grab; z-index: 4; }
  #scrub:active { cursor: grabbing; }
  #scrub:focus-visible ~ .knob { box-shadow: 0 0 0 4px var(--purple), 0 0 0 7px rgba(255,255,255,.5); }
  #fine, #hint { position: fixed; z-index: 4; bottom: calc(20px + env(safe-area-inset-bottom)); margin: 0; font: 600 12px/1.3 var(--font); letter-spacing: .15em; text-transform: uppercase; color: var(--mute); opacity: .85; }
  #fine { left: max(16px, 2.5vw); }
  #hint { right: max(16px, 2.5vw); text-align: right; }
  #hint kbd { font: inherit; color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 1px 5px; }
  #hint { line-height: 2.05; bottom: calc(15px + env(safe-area-inset-bottom)); }

  /* ---------- car-style switch ---------- */
  #garage { display: inline-flex; align-items: center; gap: 1px; margin: 11px 0 0 -1px; padding: 2px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(12,14,18,.66); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; transition: opacity .6s; }
  body.live #garage { opacity: 1; }
  #garage span { padding: 1px 5px 0 9px; font: 600 11px/1 var(--font); letter-spacing: .17em; text-transform: uppercase; color: var(--mute); }
  #garage button { border: 0; background: none; color: var(--mute); cursor: pointer; padding: 6px 10px 5px; border-radius: 999px; font: 700 12px/1 var(--font); letter-spacing: .15em; text-indent: .15em; text-transform: uppercase; transition: color .15s, background .15s; }
  #garage button:hover { color: #fff; }
  #garage button[aria-pressed="true"] { color: #fff; background: rgba(182,92,255,.24); box-shadow: inset 0 0 0 1px rgba(182,92,255,.75); }
  #garage button:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }

  @media (max-width: 900px) { #fine, #hint { display: none; } }
  @media (max-width: 640px) {
    #brand .sectors { margin: 7px 0 6px 2px; }
    #brand .sectors i { width: 22px; height: 3px; }
    #brand p span { display: none; }
    #garage { margin-top: 6px; padding: 1px; }
    #garage span { display: none; }
    #garage button { padding: 5px 8px 4px; font-size: 11px; }
    #stamp .lights i { width: 8px; height: 8px; }
    #stamp .headline { max-width: 150px; margin-left: auto; }
    .label { padding: 6px 0 4px 8px; }
    .label.left { padding: 6px 8px 4px 0; }
    .r1 { flex-wrap: wrap; gap: 3px 6px; }
    .left .r1 { justify-content: flex-start; }
    .pos { font-size: 25px; }
    .badge { width: 19px; height: 19px; }
    .name { flex-basis: 100%; font-size: 19px; }
    .r2 { margin-top: 4px; font-size: 14px; gap: 6px; }
    .int, .r3, .lead .gap { display: none; }
    .chip { font-size: 10px; padding: 2px 4px 1px; }
    .chip.fl { letter-spacing: .08em; }
    #tl .tick { font-size: 12px; letter-spacing: .1em; }
  }
  @media (max-height: 560px) {
    #brand p, #stamp .headline, #stamp .lights, .r3, .int, #fine, #hint { display: none; }
    #brand h1 { font-size: 30px; }
    #garage { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); margin: 0; }
    #stamp .date { margin-top: 0; font-size: 22px; }
    .label, .label.left { padding-top: 5px; padding-bottom: 3px; }
    .pos { font-size: 22px; } .name { font-size: 18px; }
    .badge { width: 18px; height: 18px; }
    .r2 { margin-top: 3px; font-size: 13px; }
  }
</style>
</head>
<body>
<canvas id="track" aria-hidden="true"></canvas>
<div id="labels" aria-live="off"></div>
<div id="curtain" aria-hidden="true"></div>

<header id="brand">
  <h1>Fastest <em>Lab</em></h1>
  <div class="sectors"><i></i><i></i><i></i></div>
  <p>The AI model grand prix<span> · gaps by vibes</span></p>
  <div id="garage" role="group" aria-label="Car style"><span aria-hidden="true">Cars</span></div>
</header>

<div id="stamp">
  <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="date"></div>
  <div class="headline"></div>
  <div class="demo" hidden>Illustrative snapshot</div>
</div>

<footer id="deck">
  <button id="play" aria-label="Replay the season">
    <svg class="go" viewBox="0 0 14 14"><path d="M3 1.2v11.6L13 7z"/></svg>
    <svg class="pause" viewBox="0 0 14 14"><path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/></svg>
  </button>
  <div id="tl">
    <div class="rail"><div class="fill"></div></div>
    <input id="scrub" type="range" min="0" max="1000" step="1" value="1000" aria-label="Timeline">
    <div class="knob"></div>
  </div>
</footer>
<p id="fine">One person's opinion.<br>Gaps are vibes, not benchmarks.</p>
<p id="hint"><kbd>←</kbd> <kbd>→</kbd> travel in time<br><kbd>C</kbd> change cars</p>

<!-- ═══ DATA · the standings, the labs and their logos. This is the block to edit. ═══ -->
<script id="race-data">
/* ════════════════════════════════════════════════════════════════════════
   FASTEST LAB · the data. Everything the page shows comes from this block.
   ════════════════════════════════════════════════════════════════════════

   Three blocks, most-edited first:

     SNAPSHOTS   who was where, and when      a plain-text table
     LABS        who the labs are             name, sub, livery, rebrands
     LOGOS       the marks on the cars        SVG path data

   Save and reopen index.html. It stays one self-contained file, so it opens anywhere. No build step, no server needed.
   If something is wrong the page keeps running with what it could read,
   shows a yellow warning at the top, and the browser console names every
   problem: the snapshot, the lab and what to write instead.


   SNAPSHOTS · a worked example
   ────────────────────────────

       2026-11-20  Clear air up front
         anthropic            Clear leader.
         openai     +1.00     Still second.
         google     +0.25     Right on OpenAI's gearbox.

   • A line that starts with a date (YYYY-MM-DD) opens a snapshot. The rest
     of that line is the headline. Add (demo) at the end to flag the
     snapshot as an illustrative guess.
   • Every line below it is one car, in finishing order, P1 first:

         lab id      gap to the car AHEAD      note

     The gap is in seconds: +0.25 is wheel to wheel, +1.00 is a clear lead.
     Bigger number = more empty road. The leader has no gap.
   • A lab that isn't listed isn't on track at that date. In a replay it
     comes up the kerb from behind at the first snapshot that lists it,
     and pulls off onto the kerb when a snapshot stops listing it.
   • Snapshots can be in any order; the page sorts them by date. Indentation
     and column alignment are only for your eyes.
   • Lines starting with # are comments. Blank lines are ignored.
   • One-off override for a single car in a single snapshot, after the note:

         spacexai   +0.30     Close behind Meta.   | name=X.AI | sub=Grok 5

     (name, sub and logo can be overridden. Lasting changes belong in LABS.)
   • The only character you can't use is the backtick ` because it ends
     the block.

   Generated data can use the same table, or the older object form, which
   the page also accepts unchanged:

       var SNAPSHOTS = [
         { date: '2026-11-20', headline: 'Clear air up front', standings: [
           { lab: 'anthropic', gap: 0,    note: 'Clear leader.' },
           { lab: 'openai',    gap: 1.00, note: 'Still second.' },
         ] },
       ];
   ════════════════════════════════════════════════════════════════════════ */

var SNAPSHOTS = `

# Two years of standings, November 2024 to November 2026. The reasoning and
# the sources behind every snapshot are in research/standings-history.md.
# Scale: +0.25 is wheel to wheel, +1.00 a clear lead, +1.70 a big break.

# cars around it are exactly as far from the leader as the research says.

2024-11-20  OpenAI's race to lose
  openai                o1 on pole, the field regrouping.
  anthropic   +0.40     The coders' car of choice.
  google      +0.45     Experimental Geminis trading fastest laps.
  meta        +1.30     Best of the open-weights class.
  spacexai    +0.35     Grok 2: still learning the circuit.

# DeepSeek R1 (Jan 20), Grok 3 (Feb 17), Claude 3.7 Sonnet + Claude Code (Feb 24), GPT-4.5 (Feb 27)
2025-02-28  Grok 3 gatecrashes the front
  openai                Deep Research, o3-mini, GPT-4.5. Still ahead.
  anthropic   +0.35     Sonnet 3.7 arrives with Claude Code.
  google      +0.30     Gemini 2.0: quick, not quickest.
  spacexai    +0.15     Grok 3 comes from nowhere.
  deepseek    +0.40     Wildcard R1 knocks 17% off Nvidia in a day.
  meta        +1.30     Overtaken by wildcard entry DeepSeek.

# Gemini 2.5 Pro (Mar 25) debuts #1 on LMArena by ~40 points; Llama 4 (Apr 5) benchmark row; o3 lands Apr 16
2025-04-10  Gemini 2.5 takes pole
  google                Gemini 2.5 Pro. Forty Elo clear.
  openai      +0.20     Ghibli goes viral; o3 still garaged.
  anthropic   +0.30     Sonnet 3.7 keeps the coders loyal.
  spacexai    +0.45     Grok 3 hangs on to the pack.
  deepseek    +0.70     No upgrades, still quicker than Llama 4.
  meta        +1.20     Llama 4: stewards reviewing those benchmarks.

# o3 / o3-pro, Gemini 2.5 Pro + Veo 3 at I/O, Claude 4 (May 22), R1 refresh (May 28); Meta delays Behemoth
2025-06-10  Three abreast into summer
  openai                o3-pro, by a front wing.
  google      +0.15     I/O upgrades: 2.5 Pro and Veo 3.
  anthropic   +0.15     Claude 4 tops the coding sector.
  spacexai    +0.90     Waiting on the Grok 4 upgrade.
  deepseek    +0.55     A one-car team, still in the points.
  meta        +1.35     Behemoth delayed. Chequebook out.

2025-08-10  GPT-5: bumpy but ahead
  openai                Rough launch, still fastest.
  anthropic   +0.30     Opus 4.1 and a Claude Code boom.
  google      +0.10     Genie 3 dazzles; 2.5 Pro ages.
  spacexai    +0.25     Grok 4 led the index in July.
  meta        +2.60     Signing drivers, not setting laps.

2025-10-01  The coding war
  openai                GPT-5 on top; Sora 2 lands.

  google      +0.25     Nano Banana wins the crowd.
  spacexai    +0.50     Fast and cheap, drifting back.
  meta        +2.60     Still in the garage.

2025-12-03  Code red at OpenAI
  google                Gemini 3 Pro tops the timing screens.
  anthropic   +0.20     Opus 4.5 breaks 80% on SWE-bench.
  openai      +0.20     Code red on the pit wall.
  spacexai    +0.90     Grok 4.1 can't follow the leaders.
  meta        +2.40     LeCun leaves the team.

2026-02-20  Claude Code fever
  anthropic             Opus 4.6 and a Claude Code craze.
  google      +0.15     Gemini 3.1 Pro tops the index.
  openai      +0.15     GPT-5.3-Codex launched minutes after Opus.

# GPT-5.5 (Apr 23) tops the index by 3; Opus 4.7 backlash; Mythos Preview restricted; Muse Spark (Apr 8)
2026-04-24  GPT-5.5 strikes back
  openai                GPT-5.5 goes three points clear.

2026-06-10  Fable 5 rewrites the board
  anthropic             Fable 5: five points clear at launch.

  anthropic             Fable back from its red flag.
  openai      +0.45     GPT-5.6 Sol: one point off the lead.
  moonshot    +0.50     Kimi K3: wildcard, third fastest on debut.
  spacexai    +0.50     New name, new pace: Grok 4.5.
  google      +0.10     Three new Flashes, still no Pro.
  meta        +0.25     Muse Spark 1.1 keeps the tow.

# Fable 5.1 (Sep 1), Muse Spark 1.3 (Sep 2), GPT-6 Astra (Sep 3-4); Google at its low point
2026-09-10  GPT-6 arrives
  anthropic             Fable 5.1 keeps its nose ahead.
  openai      +0.30     GPT-6 Astra: level on coding.
  meta        +1.10     Muse Spark 1.3: best of the rest.
  spacexai    +0.20     Grok 4.6 matched GPT-5.6. Briefly.
  moonshot    +0.10     Kimi K3 keeps Google in its mirrors.
  google      +0.15     Seven months without a Pro.

# Opus 5.5 (Sep 22), Gemini 4 Argon (Sep 30, GA Oct 13), Muse Wonder (Oct 12), Grok 4.7 (Sep 21)
2026-10-15  Gemini 4 rejoins the fight
  anthropic             Opus 5.5: fastest by several points.
  openai      +0.85     GPT-6 fast, but not Opus fast.

/* ────────────────────────────────────────────────────────────────────────
   PLAYBACK · the replay you get from the play button (or the space bar).

   A replay goes back to the first snapshot, shows the start lights,
   launches the labs of that first snapshot off the grid, then drives
   through every snapshot up to the latest. Each snapshot is one step:
   the cars MOVE to the new standings, then HOLD there so you can read it.

   length      Seconds the whole drive from first to latest snapshot should
               take (lights and launch come on top). This is the one to
               change: 30 = "two years in half a minute".
   spacing     How `length` is shared between the steps:
               'calendar'  a step lasts in proportion to the real time
                           between its two snapshots (six quiet months take
                           longer than one busy month)
               'uniform'   every step lasts the same
   transition  [shortest, longest] seconds the cars take to move from one
               snapshot to the next. The overtakes happen here. A step in
               which a lab joins or leaves takes at least the middle of
               the two: that car has the whole field to drive past.
   hold        [shortest, longest] seconds the picture rests on a snapshot.
               The shortest hold is what keeps close snapshots readable.

   How they combine: each step gets its share of `length`, but never less
   than shortest move + shortest hold and never more than longest move +
   longest hold. The move takes what it can, the hold gets the rest. So
   `length` is hit exactly whenever those limits allow it. With many
   snapshots the replay runs longer rather than rushing; with very few it
   ends early rather than idling. `fastestLab.plan()` in the browser console
   prints the resulting timing.

   speed       Multiplier on the whole replay. 2 = twice as fast. Add
               ?speed=2 to the page address to try a value without editing.
   lights      Seconds for the five start lights to come on and go out.
   launch      Seconds from lights out until the first standings are reached.
   ──────────────────────────────────────────────────────────────────────── */

  spacing: 'calendar',

function parseDate(s) {             // 'YYYY-MM-DD' (or 'YYYY-MM') → UTC ms, NaN when it isn't a real date
  const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(String(s).trim());
  if (!m) return NaN;

// The plain-text table (see the top of the DATA block) → the same shape as the object form.
function readSnapshotText(text) {
  const out = []; let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line[0] === '#' || line.startsWith('//')) continue;
    if (/^\d/.test(line)) {                                   // 2026-11-20  Headline  (demo)
      const m = /^(\S+)\s*(.*?)\s*(\(demo\))?$/i.exec(line);
      out.push(cur = { date: m[1], headline: m[2], demo: !!m[3], standings: [] });
      continue;
    }
    if (!cur) { bad(`"${line}" comes before any snapshot. Open one first with a date line such as "2026-11-20  Headline".`); continue; }
    const [main, ...extras] = line.split('|');                // lab  +gap  note  | name=…
    const m = /^(\S+)(?:\s+([+-]?\d*[.,]?\d+)(?=\s|$))?\s*(.*)$/.exec(main.trim());
    const e = { lab: m[1], note: m[3] };
    if (m[2] != null) {
      // On the leader's line only a +number is a gap, so a note like "40 Elo clear" stays a note.
      if (cur.standings.length || /^[+-]/.test(m[2])) e.gap = +m[2].replace(',', '.');
      else e.note = (m[2] + ' ' + m[3]).trim();
    }
    for (const x of extras) {
      const kv = /^\s*(name|sub|logo)\s*=\s*(.+?)\s*$/.exec(x);
      if (kv) e[kv[1]] = kv[2];
      else bad(`Snapshot ${cur.date}, ${e.lab}: "| ${x.trim()}" isn't an override. Use | name=… | sub=… or | logo=….`);
    }
    cur.standings.push(e);
  }
  return out;
}

const labs = {};

  if (!HEX.test(color || '')) { bad(`LABS.${id}: color "${color}" isn't a hex colour like #D9774F. Using grey.`); color = '#8A9099'; }
  if (!HEX.test(accent || '')) { if (accent != null) bad(`LABS.${id}: accent "${accent}" isn't a hex colour like #F6EDE0. Using white.`); accent = '#F4F5F7'; }

    .sort((a, b) => a.t - b.t);

function whoIs(c, time, e) {

/* ---------- logos ---------- */
let gradIds = 0;

/* ---------- layout ---------- */
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  const mobile = W <= 640;
  const short = H < 560;                                // phones on their side
  const top = short ? 70 : mobile ? 112 : 126;          // leader's nose
  const bottom = H - (short ? 82 : mobile ? 96 : 104);  // last car's tail
  const usable = Math.max(150, bottom - top);
  let carLen = clamp(usable * 0.152, 30, 122);
  const kerbW = mobile ? 7 : 10;
  const labelMin = mobile ? 106 : 150;
  carLen = Math.min(carLen, Math.max(30, (W - 2 * labelMin - 2 * kerbW - 16) / 4 / 0.46));
  // The longest field of the whole timeline has to fit, and a car may not hide more than `carGap`
  // seconds of road: with more labs or bigger gaps the cars shrink instead of piling up.
  carLen = Math.max(22, Math.min(carLen, TUNING.carGap * usable / (MAX_SPAN + TUNING.carGap)));
  const carW = carLen * 0.46;
  const roadHalf = carW * 2;
  const side = W / 2 - roadHalf - kerbW;
  const S = carLen / 100, z0 = roadHalf + kerbW, lw = Math.min(mobile ? 150 : 310, side - (mobile ? 8 : 18));
  const roomy = side - lw - 19 >= 96 * S;               // is there room for scenery outside the labels?
  const scale = (usable - carLen) / MAX_SPAN;
  const gridCars = snaps[0].order.length;
  const xpin = carW * (0.64 + 1.15) + 1;                // the kerb line, outside wheels over the kerb: where cars join and retire.
                                                        // Far enough out that a car in the lane beside it needn't move over.
  L = {
    mobile, top, bottom, carLen, carW, kerbW, roadHalf, cx: W / 2, S, z0, scale,
    // The barrier line. Roomy: just outside the labels, so the busy scenery never sits under them.
    // Otherwise it shares the side with the labels, dimmed, and each label gets a darker plate.
    zo: roomy ? z0 + lw + 19 : z0 + side * .4, dim: roomy ? 0 : .45,
    laneOff: carW * 0.64,

    // beside the road (the pit wall, on narrow screens) may start closer than this.
    reach: xpin + carW / 2 + 7 * S + 2,

  labelsEl.classList.toggle('dense', Math.ceil(MAX_CARS / 2) * (mobile ? 78 : 106) > usable * .94);
  for (const c of cars) buildSprites(c);

  buildScenery();

  thinTicks();
}

      ctx.strokeStyle = '#3d424b'; ctx.lineWidth = 2.5 * S; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.fillStyle = '#2b2f36'; ctx.beginPath(); ctx.arc(x0, y, 5 * S, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff3d6'; ctx.fillRect(x1 - 3 * S, y - 13 * S, 6 * S, 26 * S);
      dot(SC.flash, x1, y, 30 * S, .42);
    }
  }
  if (L.dim) { ctx.fillStyle = `rgba(7,11,9,${L.dim})`; ctx.fillRect(0, 0, cx - zo + 18 * S, H); ctx.fillRect(cx + zo - 18 * S, 0, hw, H); }
}

/* overhead: gantries and footbridges, drawn over the cars */
function drawOverhead() {
  const { cx, S, z0, zo } = L, base = L.gridTop + world * S, n0 = Math.round(world / LAP);
  const truss = y => {
    const x0 = cx - z0 - 10 * S, x1 = cx + z0 + 10 * S, h = 6 * S;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x0 + 5 * S, y - h + 10 * S, x1 - x0, h * 2);
    ctx.strokeStyle = 'rgba(196,202,210,.9)'; ctx.lineWidth = Math.max(1, 1.6 * S); ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y - h); ctx.lineTo(x1, y - h); ctx.moveTo(x0, y + h); ctx.lineTo(x1, y + h); ctx.stroke();
    ctx.strokeStyle = 'rgba(196,202,210,.55)'; ctx.lineWidth = Math.max(.8, S);
    ctx.beginPath(); ctx.moveTo(x0, y + h);
    for (let x = x0, i = 0, n = Math.round((x1 - x0) / (h * 2)), dx = (x1 - x0) / n; i < n; i++) { ctx.lineTo(x + dx / 2, y - h); ctx.lineTo(x += dx, y + h); }
    ctx.stroke();
    ctx.fillStyle = '#343941'; ctx.fillRect(x0 - 5 * S, y - 8 * S, 10 * S, 16 * S); ctx.fillRect(x1 - 5 * S, y - 8 * S, 10 * S, 16 * S);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x0 - 5 * S, y - 8 * S, 10 * S, 1.5); ctx.fillRect(x1 - 5 * S, y - 8 * S, 10 * S, 1.5);
  };
  const off = y => y < -90 * S || y > H + 90 * S;
  for (let n = Math.max(0, n0 - 1); n <= n0 + 1; n++) {
    const pl = plan(n);
    let y = base - (n * LAP + 66) * S;
    if (!off(y)) {                                                                                  // start gantry: the five lights
      truss(y);
      for (let i = 0; i < 5; i++) {
        const x = cx + (i - 2) * 25 * S, on = n === 0 && i < intro.lit;
        ctx.fillStyle = '#0b0c0f'; ctx.fill(rr(x - 9 * S, y - 7 * S, 18 * S, 14 * S, 3 * S));
        ctx.fillStyle = on ? '#ff2a1f' : '#3a1517'; ctx.beginPath(); ctx.arc(x, y, 4.2 * S, 0, TAU); ctx.fill();
        if (on) dot(SC.flash, x, y, 13 * S, .5);
      }
    }
    y = base - pl.drs * S;
    if (!off(y)) {                                                                                  // DRS detection point
      truss(y);
      ctx.fillStyle = '#0c7a40'; ctx.fillRect(cx - 50 * S, y - 9 * S, 100 * S, 18 * S);
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; ctx.strokeRect(cx - 50 * S, y - 9 * S, 100 * S, 18 * S);
      stamp(label('DRS DETECTION', 12.5 * S, '700', '#ffffff'), cx, y);
    }
    for (const b of pl.bridges) {                                                                   // footbridge with a banner
      y = base - b.p * S; if (off(y)) continue;
      const h = 22 * S, [bg, fg] = SCHEMES[b.i % 4], bw = z0 + 14 * S;
      ctx.fillStyle = 'rgba(0,0,0,.34)'; ctx.fillRect(0, y - h + 13 * S, W, h * 2);
      for (const sd of [-1, 1]) { ctx.fillStyle = '#23272e'; ctx.fillRect(cx + sd * (zo + 22 * S) - 30 * S, y - 40 * S, 60 * S, 80 * S); ctx.fillStyle = 'rgba(255,255,255,.07)'; for (let i = 0; i < 6; i++) ctx.fillRect(cx + sd * (zo + 22 * S) - 30 * S, y - 38 * S + i * 13 * S, 60 * S, 1.5); }
      const dg = ctx.createLinearGradient(0, y - h, 0, y + h); dg.addColorStop(0, '#272b33'); dg.addColorStop(1, '#191c22');
      ctx.fillStyle = dg; ctx.fillRect(0, y - h, W, h * 2);
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(0, y - h, W, 1.5); ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(0, y + h - 1.5, W, 1.5);
      ctx.fillStyle = bg; ctx.fillRect(cx - bw, y - 15 * S, bw * 2, 30 * S);
      const c = label(BRIDGES[b.i % BRIDGES.length], 23 * S, 'italic 800', fg);
      stamp(c, cx, y, 0, Math.min(1, (bw * 2 - 12 * S) / c.w));
    }
  }
}

/* ---------- five lights, then away we go (replays only) ---------- */
const lights = [...document.querySelectorAll('#stamp .lights i')];
function setLights(n) { if (intro.lit === n) return; intro.lit = n; lights.forEach((el, i) => el.classList.toggle('on', i < n)); }
function setIntro(k) {              // k = seconds since the cars lined up on the grid
  const go = PLAYBACK.lights, u = go / 2.26, run = Math.max(.1, PLAYBACK.launch);
  setLights(k < go ? clamp(Math.floor((k - .5 * u) / (.24 * u)) + 1, 0, 5) : 0);
  const p = clamp((k - go) / run, 0, 1);
  intro.e = easeIO(p);
  intro.speedF = easeOut(clamp((k - go) / (run * .57), 0, 1));
  intro.hud = smooth(.5, .95, p);
}

/* ---------- timeline ---------- */
const scrub = $('#scrub'), knob = $('#tl .knob'), fill = $('#tl .fill'), playBtn = $('#play');
const dateEl = $('#stamp .date'), headEl = $('#stamp .headline'), demoEl = $('#stamp .demo');
const ticks = snaps.map((s, i) => {
  const b = document.createElement('button');
  const d = new Date(s.time);
  b.className = 'tick'; b.type = 'button'; b.style.left = tPos[i] * 100 + '%';
  b.textContent = `${MONTHS[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`;
  const tk = document.createElement('i'); tk.className = 'tk'; tk.style.left = b.style.left; $('#tl').appendChild(tk);
  b.setAttribute('aria-label', `Go to ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`);
  b.addEventListener('click', () => goTo(i));
  $('#tl').appendChild(b);
  return b;
});
if (LAST < 1) { $('#deck').style.display = 'none'; $('#hint').style.display = 'none'; }
function thinTicks() {              // every snapshot keeps its tick mark; date labels only where they fit
  const w = $('#tl').clientWidth || 1, need = L.mobile ? 52 : 60;
  let right = tPos[LAST] * w;
  for (let i = LAST; i >= 0; i--) {
    const x = tPos[i] * w, show = i === LAST || i === 0 || (right - x >= need && x >= need);
    ticks[i].classList.toggle('mute', !show);
    if (show) right = x;
  }
}

function animTo(to, dur, ease = easeIO) { tl.anim = { from: tl.idx, to, t0: performance.now(), dur, ease }; }
function goTo(i, dur) {
  cancelReplay();
  i = clamp(i, 0, LAST);
  animTo(i, dur ?? clamp(Math.abs(i - tl.idx) * 1500, 450, 3200));
}
function stepAnim(now) {
  if (!tl.anim) return;
  const a = tl.anim, p = clamp((now - a.t0) / a.dur, 0, 1);
  tl.idx = lerp(a.from, a.to, a.ease(p));
  if (p >= 1) { tl.idx = a.to; tl.anim = null; }
}

/* ---------- replay: back to the first snapshot, lights, launch, then every snapshot in turn ---------- */
const SPEED = +query.get('speed') > 0 ? +query.get('speed') : +PLAYBACK.speed > 0 ? +PLAYBACK.speed : 1;
const DIP = 0.45;                   // seconds to fade to black (and back) around the jump to the grid
const replay = { on: false, t: 0, onGrid: false, plan: null };
const range = v => { const [a, b] = [].concat(v).map(Number); return [Math.max(0, a || 0), Math.max(a || 0, b ?? a ?? 0)]; };

// PLAYBACK → seconds per step. Each step gets a share of `length` (by calendar time or evenly),
// kept between shortest and longest move + hold; the factor is searched so the total hits `length`.
function buildPlan() {
  const [t0, t1] = range(PLAYBACK.transition), [h0, h1] = range(PLAYBACK.hold);
  const hi = Math.max(.2, t0 + h0, t1 + h1);
  const w = snaps.slice(1).map((s, k) => PLAYBACK.spacing === 'uniform' ? 1 : Math.max(1, s.time - snaps[k].time));
  // a step in which a lab joins or leaves never gets the shortest transition: that car has the whole field to drive past
  const m0 = snaps.slice(1).map((s, k) => s.order.some(id => !(id in snaps[k].gaps)) || snaps[k].order.some(id => !(id in s.gaps)) ? (t0 + t1) / 2 : t0);
  const lo = k => Math.max(.2, m0[k] + h0);
  const sum = f => w.reduce((a, x, k) => a + clamp(f * x, lo(k), hi), 0);
  let a = 0, b = w.length ? hi / Math.min(...w) : 0;
  for (let n = 0; n < 50; n++) { const m = (a + b) / 2; if (sum(m) < PLAYBACK.length) a = m; else b = m; }
  const steps = w.map((x, k) => { const s = clamp(b * x, lo(k), hi), move = Math.max(.1, clamp(s - h0, m0[k], t1)); return { move, hold: Math.max(0, s - move) }; });
  const first = clamp(h0, .8, 1.6);                     // rest on the first standings after the launch
  const drive = steps.reduce((n, s) => n + s.move + s.hold, 0);
  return { steps, first, drive, total: DIP * 2 + .2 + PLAYBACK.lights + PLAYBACK.launch + first + drive, speed: SPEED };
}
function toGrid() {                 // under the black: everything back to the start line
  tl.idx = 0; tl.anim = null; scroll = 0; setWorld(0); sparks.length = 0;
  intro.e = intro.speedF = intro.hud = 0;
  for (const c of cars) c.on = false;                   // so each one is placed afresh, in its grid slot
}
function setCurtain(v) { v = clamp(v, 0, 1).toFixed(2); if (curtainEl.style.opacity !== v) curtainEl.style.opacity = v; }
function cancelReplay() { if (!replay.on) return; replay.on = false; setCurtain(0); }
function play() {
  if (LAST < 1) return;
  if (replay.on) { cancelReplay(); animTo(Math.round(tl.idx), 400); return; }      // the same button stops it
  tl.anim = null; tl.dragging = false;
  replay.on = true; replay.t = 0; replay.onGrid = false; replay.plan = buildPlan();
}
function stepReplay(dt) {
  if (!replay.on) {                 // racing as normal; if a replay was cut short on the grid, roll off it
    for (const k of ['e', 'speedF', 'hud']) intro[k] = Math.min(1, intro[k] + dt * 2.5);
    setLights(0);
    return;
  }
  const T = (replay.t += dt * SPEED), plan = replay.plan;
  setCurtain(T < DIP ? T / DIP : 1 - (T - DIP) / DIP);
  if (T < DIP) return;
  if (!replay.onGrid) { replay.onGrid = true; toGrid(); }
  const k = T - DIP - .2;           // let the picture come back before the first light
  setIntro(Math.max(0, k));
  let r = k - PLAYBACK.lights - PLAYBACK.launch - plan.first;
  tl.idx = 0;
  for (let i = 0; i < plan.steps.length && r > 0; i++) {
    const s = plan.steps[i];
    if (r < s.move) { tl.idx = i + easeIO(r / s.move); return; }
    tl.idx = i + 1; r -= s.move;
    if (r < s.hold) return;
    r -= s.hold;
  }
  if (r > 0) replay.on = false;     // arrived at today
}

scrub.addEventListener('input', () => { cancelReplay(); tl.anim = null; tl.dragging = true; tl.idx = posToIdx(scrub.value / 1000); });
const release = () => { if (!tl.dragging) return; tl.dragging = false; animTo(Math.round(tl.idx), 420, easeOut); };
scrub.addEventListener('change', release);
scrub.addEventListener('pointerup', release);
scrub.addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) e.preventDefault(); });
playBtn.addEventListener('click', play);
addEventListener('keydown', e => {
  if (LAST < 1) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') goTo(Math.ceil(tl.idx - 1e-3) - 1);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') goTo(Math.floor(tl.idx + 1e-3) + 1);
  else if (e.key === ' ' && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); play(); }
});

let uiCache = {};
function syncTimelineUI() {
  const pos = idxToPos(tl.idx), near = Math.round(tl.idx), dist = Math.abs(tl.idx - near);
  if (!tl.dragging) scrub.value = Math.round(pos * 1000);
  knob.style.left = fill.style.width = (pos * 100).toFixed(2) + '%';
  const d = new Date(timeAt(tl.idx));
  const date = `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  if (uiCache.date !== date) dateEl.textContent = uiCache.date = date;
  if (uiCache.near !== near) {
    uiCache.near = near; L.lh = 0;
    headEl.textContent = snaps[near].headline || '';
    demoEl.hidden = !snaps[near].demo;
    ticks.forEach((b, k) => b.classList.toggle('on', k === near));
  }
  const o = (1 - smooth(.04, .2, dist)).toFixed(2);
  if (uiCache.o !== o) headEl.style.opacity = demoEl.style.opacity = uiCache.o = o;
  if (uiCache.playing !== replay.on) playBtn.classList.toggle('playing', uiCache.playing = replay.on);
}

/* ---------- simulation ---------- */
function updateCars(t, dt) {
  // 1. Who is on track right now, and where the data puts them (seconds behind the leader).
  //    Between two snapshots a lab listed in both simply drives from one gap to the other.
  //    A lab only in the earlier one retires: it moves over onto the kerb, then falls away backwards
  //    (first 60% of the step). A lab only in the later one joins: it comes in from below the screen
  //    and drives up the edge of the road, the field moving over for it, then tucks into its slot
  //    (last 75% of the step). Retirements go first so the two rarely meet.
  const i = clamp(Math.floor(tl.idx), 0, LAST), j = Math.min(i + 1, LAST), f = tl.idx - i;
  const A = snaps[i].gaps, B = f > 0 ? snaps[j].gaps : A;
  const k1 = Math.ceil(tl.idx - 1e-9), debut = k1 > 0 ? snaps[k1].gaps : null, before = k1 > 0 ? snaps[k1 - 1].gaps : null;
  const gOut = clamp(f / .6, 0, 1), gIn = clamp((f - .25) / .75, 0, 1);
  let min = Infinity, outSide = 0;
  for (const c of cars) {
    const a = A[c.id], b = B[c.id];
    c.spawn = !c.on;
    c.on = a != null || b != null;
    if (c.spawn && c.on) L.lh = 0;                      // its label has just been filled in: measure the labels again
    if (!c.on) { c.ghost = c.pin = c.pw = 0; c.fresh = false; c.ahead = null; c.by = 1e5; continue; }
    const ghost = a == null ? 1 : b == null ? -1 : 0;
    if (ghost !== c.ghost) {                            // a newcomer that still has cars to get past keeps the kerb until it is through
      c.esc = c.ghost > 0 && !ghost && c.pw > 0 ? c.pin : 0; c.pin = 0;
    }
    c.ghost = ghost;
    c.fresh = !!debut && c.id in debut && !(c.id in before);
    c.raw = c.ghost > 0 ? lerp(L.off, b, 1 - Math.pow(1 - gIn, 1.35))
          : c.ghost < 0 ? lerp(a, L.off, Math.pow(clamp((gOut - .12) / .88, 0, 1), 2))
          : lerp(a, b, f);
    if (c.ghost < 0) outSide = c.pin = c.pin || Math.sign(c.x) || c.lane;      // retires onto the kerb on its own side
    if (c.raw < min) min = c.raw;
  }
  const act = cars.filter(c => c.on).sort((a, b) => a.raw - b.raw || (B[a.id] ?? 1e9) - (B[b.id] ?? 1e9) || a.rank - b.rank);
  let prev = null;
  act.forEach((c, r) => {
    c.raw -= min; c.rank = r; c.gap = c.raw;
    // intervals are between classified cars: one that is arriving or retiring isn't measured against
    if (c.ghost) { c.ahead = null; c.int = 0; } else { c.ahead = prev; c.int = prev ? c.raw - prev.raw : 0; prev = c; }
    const road = L.top + c.raw * L.scale;
    c.ty = intro.e < 1 && c.gridSlot >= 0 ? lerp(L.gridTop + c.gridSlot * L.carLen * 0.62, road, intro.e) : road;
    if (c.ghost > 0) {                                  // joins up the right-hand kerb (the left one, if a car is retiring on the right)
      c.pin = c.pin || -outSide || 1; c.esc = 0;
      const tuck = 1 - smooth(.7, 1, gIn);              // it comes off the kerb for the last part of the way, unless a car is still in the way
      c.pw = c.yo > L.carLen * .08 ? Math.min(1, Math.max(tuck, c.pw + 3 * dt)) : Math.max(tuck, c.pw - 2.5 * dt);
      if (c.spawn) { c.lane = c.side = c.pin; c.x = c.px = c.pin * L.xpin; c.vx = c.yo = c.ly = 0; }
    } else if (c.ghost < 0) { c.pw = smooth(0, .25, gOut); c.esc = 0; }
    else {
      if (c.spawn) { c.lane = c.side = r % 2 ? 1 : -1; c.x = c.px = c.lane * L.laneOff; c.vx = c.yo = c.ly = c.pw = c.esc = c.stuck = 0; }
      // Boxed in: a car held well behind its place for half a second takes to the kerb to get by,
      // and comes back onto the road once it has. This is what stops traffic jams from sticking.
      c.stuck = c.yo > L.carLen * .3 ? c.stuck + dt : 0;
      if (!c.esc && c.stuck > .5) {                     // the nearer kerb, if nobody is alongside on that side; else the other
        const near = Math.sign(c.x) || c.lane, open = side => !act.some(o => o !== c && Math.abs(o.by - c.by) < L.carLen * 1.16 && Math.sign(o.x - c.x) === side);
        c.esc = open(near) ? near : open(-near) ? -near : 0;
      }
      if (c.esc) { const clear = c.yo < L.carLen * .08; c.pw = clamp(c.pw + (clear ? -2.5 : 3) * dt, 0, 1); if (clear && !c.pw) c.esc = 0; }
      else c.pw = 0;
      c.pin = c.esc;
    }
  });

  // 2. Lanes. Try all 2^n left/right assignments and keep the cheapest: never two cars nose-to-tail
  // in one lane closer than a car length, never two alongside cars swapping sides through each
  // other, and otherwise prefer the tidy P1-left / P2-right stagger.
  const near = L.carLen * 1.2, n = act.length;
  let best = 0, bestCost = Infinity;
  for (let m = 0; m < (1 << n); m++) {
    let cost = 0;
    for (let i = 0; i < n && cost < bestCost; i++) {
      const a = act[i], la = (m >> i) & 1 ? 1 : -1;
      if (a.pin && la !== a.pin) cost += 5000;                 // a car on the edge stays on its side
      if (la !== (a.rank % 2 ? 1 : -1)) cost += 1;
      if (la !== a.lane) cost += .1;
      for (let j = i + 1; j < n; j++) {
        const b = act[j], lb = (m >> j) & 1 ? 1 : -1, dy = Math.abs(a.ty - b.ty);
        if (a.pw > .5 || b.pw > .5) continue;                  // ...and out of the lanes: the field just moves over for it
        const th = a.lane === b.lane ? near : near * 1.2;      // hysteresis: harder to join a lane than to stay
        if (la === lb) { if (dy < th) cost += 50 + 100 * (1 - dy / th); }
        else if (dy < near * 1.2 && ((la !== a.lane && lb !== b.lane) || (lb - la) * (b.x - a.x) < -L.carW * .5)) cost += 1000;
      }
    }
    if (cost < bestCost) { bestCost = cost; best = m; }
  }
  act.forEach((c, i) => { c.lane = (best >> i) & 1 ? 1 : -1; });

  // 3. Where each car would like to be sideways: in its lane (or on the edge of the road while it
  // joins or retires), with cars that overlap nose-to-tail spread apart. The clearance asked for
  // ramps in as two cars close up, and the road takes three abreast, so one car can come through
  // between two that are side by side. Nothing is spread while the field sits on the grid.
  for (const c of act) c.xd = c.pw ? lerp(c.lane * L.laneOff, c.pin * L.xpin, c.pw) : c.lane * L.laneOff;
  const minSep = L.carW * 1.3 * smooth(0, .5, intro.e), kerbs = act.some(c => c.pw > .05);
  for (let pass = 0; pass < 10 && minSep > 0; pass++) {
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = act[i], b = act[j];
      // a car on the edge is seen from further off, so the field moves over for it in good time
      const req = minSep * smooth(L.carLen * (a.pw || b.pw ? 3.2 : 1.45), L.carLen * 1.16, Math.abs(a.by - b.by));
      if (!req) continue;
      // a car on the kerb line has everyone else inside it; otherwise keep two cars the way round
      // they really are, because cars alongside each other can't swap sides
      const dir = (a.pw > .5 ? -a.pin : b.pw > .5 ? b.pin : 0) || (Math.abs(b.x - a.x) > .5 ? Math.sign(b.x - a.x) : 0) || Math.sign(b.lane - a.lane) || (a.seed < b.seed ? 1 : -1);
      const gap = dir * (b.xd - a.xd);
      if (gap >= req) continue;
      const ma = 1 - a.pw, mb = 1 - b.pw;                      // ...and the car on the edge doesn't give way
      if (ma + mb < .01) continue;
      const push = (req - gap) / (ma + mb);
      a.xd -= dir * push * ma; b.xd += dir * push * mb;
    }
    // the road itself, unless someone is on a kerb: then the cars beside it may be squeezed onto the other one
    for (const c of act) { const lim = c.pw ? lerp(L.xmax, L.xpin, c.pw) : kerbs ? L.xpin : L.xmax; c.xd = clamp(c.xd, -lim, lim); }
  }

  // 4. Move, under two hard rules that hold whatever steps 2 and 3 asked for, so no car ever
  // touches another. Lengthways: front to back, a car that isn't clear sideways of one ahead is
  // held a length behind it until it is. Sideways: a car alongside another only moves over as far
  // as there is room. Both act on small steps, so a blocked car waits smoothly instead of jumping.
  const xClear = L.carW * 1.15, yClear = L.carLen * 1.16, fade = Math.exp(-dt * 5);
  for (const c of act) { c.yo = c.yo * fade < .05 ? 0 : c.yo * fade; c.by = c.ty + c.yo; }   // an earlier hold eases off
  const row = act.slice().sort((a, b) => a.by - b.by || a.rank - b.rank);
  for (let i = 1; i < row.length; i++) {
    const c = row[i];
    for (let j = 0; j < i; j++) { const a = row[j]; if (Math.abs(c.x - a.x) < xClear && c.by < a.by + yClear) c.by = a.by + yClear; }
    c.yo = c.by - c.ty;
  }
  const kx = 1 - Math.exp(-dt * 6.5), vmin = L.carLen * 1.2 * dt, vmax = L.carLen * 3.6 * dt;
  for (const c of row) {
    const want = c.xd - c.x;                                   // eased, but never slower than a crawl: it does arrive
    let step = Math.sign(want) * Math.min(Math.abs(want), clamp(Math.abs(want) * kx, vmin, vmax));
    for (const o of act) {
      if (o === c || Math.abs(o.by - c.by) >= yClear || Math.sign(o.x - c.x) !== Math.sign(step)) continue;
      step = Math.sign(step) * Math.min(Math.abs(step), Math.max(0, Math.abs(o.x - c.x) - xClear - .5));
    }
    c.x += step;
    c.side += (c.lane - c.side) * (1 - Math.exp(-dt * 7));
  }

  for (const c of act) {
    c.vx = lerp(c.vx, (c.x - c.px) / Math.max(dt, .001), .18); c.px = c.x;
    // a little life: drift, surge, twitch
    const st = CAR_STYLES[carStyle], tw = t * st.pace;        // each car style has its own gait
    const w = (reduced ? 0 : TUNING.wobble) * intro.speedF * (L.carLen / 100), p = c.ph, ws = w * st.sway;
    c.wx = (Math.sin(tw * .83 + p[0]) * 2.3 + Math.sin(tw * 2.1 + p[1]) * 1.1) * ws;
    c.wy = (Math.sin(tw * .57 + p[2]) * 4.2 + Math.sin(tw * 1.43 + p[3]) * 2.1 + Math.sin(tw * 3.7 + p[4]) * .6) * w;
    const wvx = (Math.cos(tw * .83 + p[0]) * 2.3 * .83 + Math.cos(tw * 2.1 + p[1]) * 1.1 * 2.1) * ws * st.pace;
    // Tilt into the move, but never yaw into a neighbour: the closer a car alongside, the less tilt it gets.
    // (Step 4 keeps the cars themselves apart; this keeps their corners apart once they wobble and turn.)
    let lim = .14;
    for (const o of act) {
      if (o === c) continue;
      const along = smooth(L.carLen * 1.3, L.carLen * 1.1, Math.abs(c.by + c.wy - o.by - (o.wy || 0)));
      if (along > 0) lim = Math.min(lim, lerp(.14, clamp((Math.abs(c.x + c.wx - o.x - (o.wx || 0)) - L.carW * 1.02) / (L.carLen * 1.05), 0, .14), along));
    }
    c.rot = clamp((c.vx + wvx) * .0036 + Math.sin(t * 6.1 + p[5]) * st.wag * Math.min(1, w), -lim, lim);
    // sparks from the plank (or whatever this style throws), now and then
    if (TUNING.sparks && !reduced && intro.speedF > .95 && c.by < H) {
      if (c.ghost > 0 && c.pw > .6) c.sparkEnd = t + .08;       // a newcomer charging up the kerb throws them all the way
      if (t > c.sparkAt) { c.sparkEnd = t + .22 + Math.random() * .3; c.sparkAt = t + 3.5 + Math.random() * 8; }
      if (t < c.sparkEnd) st.emit(c);
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt; if (s.life > s.max) sparks.splice(i, 1); }
}

/* ---------- drawing ---------- */
function draw(t) {
  const { cx, roadHalf, kerbW, carLen, carW } = L;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const rl = cx - roadHalf, rw = roadHalf * 2;

  // grass, with mowing bands rolling by
  for (let y = (scroll % 512) - 512; y < H; y += 512) for (let x = (cx % 512) - 512; x < W; x += 512) ctx.drawImage(grass, x, y);
  const band = 170;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  for (let y = (scroll % (band * 2)) - band * 2; y < H; y += band * 2) ctx.fillRect(0, y, W, band);

  // run-off, barriers, grandstands, trees: the world beside the road
  drawTrackside(t);

  // verge + asphalt
  ctx.fillStyle = '#0a1a13'; ctx.fillRect(rl - kerbW - 9, 0, rw + kerbW * 2 + 18, H);
  ctx.save(); ctx.beginPath(); ctx.rect(rl, 0, rw, H); ctx.clip();
  for (let y = (scroll % 512) - 512; y < H; y += 512) for (let x = rl; x < rl + rw; x += 256) ctx.drawImage(asphalt, x, y);
  // rubbered-in racing lines
  const rg = ctx.createLinearGradient(rl, 0, rl + rw, 0);
  rg.addColorStop(0, 'rgba(255,255,255,.05)'); rg.addColorStop(.3, 'rgba(0,0,0,.24)'); rg.addColorStop(.5, 'rgba(0,0,0,.1)'); rg.addColorStop(.7, 'rgba(0,0,0,.24)'); rg.addColorStop(1, 'rgba(255,255,255,.05)');
  ctx.fillStyle = rg; ctx.fillRect(rl, 0, rw, H);
  // tarmac seams
  for (let y = (scroll % 430) - 430; y < H; y += 430) { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(rl, y, rw, 2); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fillRect(rl, y + 2, rw, 1); }
  // skid marks
  const cell = 640;
  ctx.lineCap = 'round'; ctx.lineWidth = carW * .15; ctx.strokeStyle = 'rgba(6,6,8,.3)';
  for (let k = Math.floor((scroll - H) / cell) - 1; k <= Math.floor(scroll / cell) + 1; k++) {
    if (k < 1) continue;
    const r = rng(k), n = r() < .8 ? 1 + (r() < .35) : 0, topY = scroll - (k + 1) * cell;
    for (let m = 0; m < n; m++) {
      const x0 = cx + (r() * 2 - 1) * roadHalf * .62, y0 = topY + r() * cell, len = 150 + r() * 280, bend = (r() * 2 - 1) * 26, sep = carW * .72;
      for (const dx of [-sep / 2, sep / 2]) { ctx.beginPath(); ctx.moveTo(x0 + dx, y0); ctx.quadraticCurveTo(x0 + dx + bend, y0 + len / 2, x0 + dx + bend * 1.7, y0 + len); ctx.stroke(); }
    }
  }
  // the grid we launched from, and the start line each time it comes round again
  const lap = Math.round(world / LAP);
  for (let n = Math.max(0, lap - 1); n <= lap + 1; n++) {
    const dy = L.gridTop + (world - plan(n).drs) * L.S;                 // DRS detection line
    if (dy > -10 && dy < H + 10) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(rl, dy, rw, 3); }
    const gy = L.gridTop + (world - n * LAP) * L.S;
    if (gy < -400 || gy > H + 400) continue;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    const sq = rw / 16;
    for (let r2 = 0; r2 < 2; r2++) for (let q = 0; q < 16; q++) if ((q + r2) % 2 === 0) ctx.fillRect(rl + q * sq, gy - 22 + r2 * sq - sq, sq, sq);
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    for (const c of cars) {
      if (c.gridSlot < 0) continue;
      const x = cx + (c.gridSlot % 2 ? 1 : -1) * L.laneOff, y = gy + c.gridSlot * carLen * .62 - 5, hw = carW * .58;
      ctx.beginPath(); ctx.moveTo(x - hw, y + 16); ctx.lineTo(x - hw, y); ctx.lineTo(x + hw, y); ctx.lineTo(x + hw, y + 16); ctx.stroke();
    }
  }
  ctx.restore();

  // edge lines + kerbs
  ctx.fillStyle = 'rgba(240,240,236,.82)'; ctx.fillRect(rl + 3, 0, 2.5, H); ctx.fillRect(rl + rw - 5.5, 0, 2.5, H);
  const bl = L.mobile ? 26 : 34;
  for (let y = (scroll % (bl * 2)) - bl * 2; y < H; y += bl * 2) {
    ctx.fillStyle = '#d6232b'; ctx.fillRect(rl - kerbW, y, kerbW, bl); ctx.fillRect(rl + rw, y + bl, kerbW, bl);
    ctx.fillStyle = '#eceae4'; ctx.fillRect(rl - kerbW, y + bl, kerbW, bl); ctx.fillRect(rl + rw, y, kerbW, bl);
  }
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(rl - kerbW, 0, 2, H); ctx.fillRect(rl + rw + kerbW - 2, 0, 2, H);
  // where the pit lane leaves and rejoins, it cuts through the kerb
  for (const s of streams['R-in'].segs) {
    if (s.type !== 'pit') continue;
    const Y = p => L.gridTop + (world - p) * L.S;
    for (const [p0, p1] of [[s.a, s.a + 300], [s.b - 300, s.b]]) {
      if (Y(p0) < 0 || Y(p1) > H) continue;
      ctx.save(); ctx.beginPath(); ctx.rect(cx + roadHalf - 2, Y(p1), kerbW + 12, Y(p0) - Y(p1)); ctx.clip();
      pitPath(s, Y); ctx.fillStyle = '#212329'; ctx.fill(); ctx.restore();
    }
  }

  // floodlight pool, and the pools under the trackside masts
  const fl = ctx.createRadialGradient(cx, H * .42, 0, cx, H * .42, Math.max(H * .62, 380));
  fl.addColorStop(0, 'rgba(255,244,224,.085)'); fl.addColorStop(1, 'rgba(255,244,224,0)');
  ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r] of glows) { const q = r * L.S; if (y > -q && y < H + q) ctx.drawImage(SC.pool, x - q, y - q, q * 2, q * 2); }
  // where scenery has to share the side with the labels, each label gets a darker plate
  if (L.dim) for (const c of cars) for (const [o, x0, x1] of [[c.oL, cx - L.edge, cx - L.edge - L.lw], [c.oR, cx + L.edge, cx + L.edge + L.lw]]) {
    if (o < .01 || !c.lh) continue;
    const pg = ctx.createLinearGradient(x0, 0, x1, 0);           // solid by the road, easing off outwards, like the label's own backdrop
    pg.addColorStop(0, `rgba(7,9,11,${(.86 * o).toFixed(3)})`); pg.addColorStop(.7, `rgba(7,9,11,${(.8 * o).toFixed(3)})`); pg.addColorStop(1, `rgba(7,9,11,${(.5 * o).toFixed(3)})`);
    ctx.fillStyle = pg; ctx.fillRect(Math.min(x0, x1), c.by - 1 + (c.ly || 0), L.lw, c.lh);
  }

  drawBeams(t);

  // ---- timing graphics ----
  const hud = intro.hud;
  if (hud > .01) {
    // nose lines: where each car "is"
    for (const c of cars) {
      if (c.by > H) continue;
      ctx.strokeStyle = rgba(c.tint, .2 * hud); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(rl + 6, c.by); ctx.lineTo(rl + rw - 6, c.by); ctx.stroke();
      const aL = clamp((-c.side - .15) / .7, 0, 1), aR = clamp((c.side - .15) / .7, 0, 1);
      ctx.lineWidth = 2;
      if (aL > 0) { ctx.strokeStyle = rgba(c.tint, .85 * hud * aL); ctx.beginPath(); ctx.moveTo(cx + c.x, c.by); ctx.lineTo(cx - L.edge, c.by); ctx.stroke(); }
      if (aR > 0) { ctx.strokeStyle = rgba(c.tint, .85 * hud * aR); ctx.beginPath(); ctx.moveTo(cx + c.x, c.by); ctx.lineTo(cx + L.edge, c.by); ctx.stroke(); }
    }
  }

  // sparks
  if (sparks.length) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineWidth = 1.6;
    for (const s of sparks) {
      const f = 1 - s.life / s.max;
      ctx.lineWidth = s.w || 1.6;
      ctx.strokeStyle = s.col ? s.col(f) : `rgba(255,${150 + 90 * f | 0},${40 + 120 * f * f | 0},${f})`;
      const tail = s.tail || .018;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * tail, s.y - s.vy * tail); ctx.stroke();
    }
    ctx.restore();
  }

  // cars, back of the field first
  for (const c of cars.slice().sort((a, b) => b.by - a.by)) {
    if (c.by > H + 40) continue;
    ctx.save();
    ctx.translate(cx + c.x + c.wx, c.by + c.wy + carLen / 2);
    ctx.rotate(c.rot);
    ctx.drawImage(c.sprite, -c.sw / 2, -c.sh / 2, c.sw, c.sh);
    CAR_STYLES[carStyle].live(c, t, carLen / 100);
    ctx.restore();
  }

  // gantries and bridges pass over the cars, but never over the gap numbers
  drawOverhead();

  if (hud > .01) {
    // interval callouts in the empty road
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineCap = 'butt';
    for (const c of cars) {
      const a = c.ahead; if (!a || c.by > H + carLen) continue;
      const y0 = a.by + carLen + 10, y1 = c.by - 9, free = y1 - y0;
      const al = smooth(18, 36, free) * hud; if (al < .01) continue;
      const mid = (y0 + y1) / 2, fs = clamp(free * .36, 14, L.mobile ? 24 : 32), half = fs * .68;
      const cap = free > fs + 74;
      ctx.strokeStyle = `rgba(255,255,255,${.6 * al})`; ctx.lineWidth = 1.25;
      ctx.beginPath();
      ctx.moveTo(cx - 9, y0); ctx.lineTo(cx + 9, y0); ctx.moveTo(cx - 9, y1); ctx.lineTo(cx + 9, y1);
      const up = mid - half - (cap ? 15 : 0);
      if (up - y0 > 3) { ctx.moveTo(cx, y0); ctx.lineTo(cx, up); }
      if (y1 - (mid + half) > 3) { ctx.moveTo(cx, mid + half); ctx.lineTo(cx, y1); }
      ctx.stroke();
      ctx.font = `italic 700 ${fs}px ${FONT}`;
      ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 8 * DPR;
      ctx.fillStyle = `rgba(255,255,255,${.96 * al})`;
      ctx.fillText('+' + c.int.toFixed(3), cx, mid + 1);
      if (cap) { ctx.font = `600 10px ${FONT}`; ctx.fillStyle = `rgba(255,255,255,${.6 * al})`; ctx.fillText('I N T E R V A L', cx, mid - half - 5); }
      ctx.shadowBlur = 0;
    }
  }

  // header / footer shade + vignette
  let sh = ctx.createLinearGradient(0, 0, 0, 150);
  sh.addColorStop(0, 'rgba(8,10,12,.82)'); sh.addColorStop(1, 'rgba(8,10,12,0)');
  ctx.fillStyle = sh; ctx.fillRect(0, 0, W, 150);
  for (const b of L.corners) {                     // a little extra night behind the wordmark and the date, now that things pass under them
    const rx = b.width * .5 + 70, ry = b.height * .5 + 46;
    ctx.save(); ctx.translate(b.left + b.width / 2, b.top + b.height / 2); ctx.scale(rx, ry);
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1); cg.addColorStop(0, 'rgba(8,10,12,.72)'); cg.addColorStop(.55, 'rgba(8,10,12,.6)'); cg.addColorStop(1, 'rgba(8,10,12,0)');
    ctx.fillStyle = cg; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
  }
  sh = ctx.createLinearGradient(0, H - 150, 0, H);
  sh.addColorStop(0, 'rgba(8,10,12,0)'); sh.addColorStop(.72, 'rgba(8,10,12,.8)'); sh.addColorStop(1, 'rgba(8,10,12,.92)');
  ctx.fillStyle = sh; ctx.fillRect(0, H - 150, W, 150);
  const vg = ctx.createRadialGradient(cx, H / 2, Math.min(W, H) * .35, cx, H / 2, Math.hypot(W, H) * .56);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function updateLabels() {
  const near = Math.round(tl.idx), dist = Math.abs(tl.idx - near), snap = snaps[near];
  const noteO = (1 - smooth(.04, .2, dist)).toFixed(2), now = timeAt(tl.idx);
  for (const c of cars) {
    if (!c.on) { c.oL = c.oR = 0; continue; }
    const e = snap.entry[c.id] || {}, who = whoIs(c, now, e);
    useLogo(c, who.logo);
    setText(c, 'pos', 'P' + (c.rank + 1));
    setText(c, 'name', who.name);
    setText(c, 'gap', c.ghost < 0 ? '' : c.rank ? '+' + c.gap.toFixed(3) : 'LEADER');
    setText(c, 'int', c.ahead && c.rank > 1 ? 'INT +' + c.int.toFixed(3) : '');
    setText(c, 'io', c.ghost < 0 ? 'Out' : c.fresh ? (L.mobile ? 'New' : 'New entry') : '');   // phone labels are too narrow for the long one
    setText(c, 'io:on', c.ghost < 0 || c.fresh);
    setText(c, 'drs:on', !!c.ahead && c.int < TUNING.drsWindow);
    setText(c, 'fl:on', c.rank === 0 && c.ghost >= 0);
    setText(c, 'el:lead', c.rank === 0);
    setText(c, 'sub', who.sub);
    setText(c, 'note', e.note || '');
    // a car that is arriving or leaving brings its label in and out with it
    const vis = intro.hud * (1 - smooth(L.bottom - L.carLen * .5, L.bottom + 24, c.by));
    c.oL = clamp((-c.side - .15) / .7, 0, 1) * vis; c.oR = clamp((c.side - .15) / .7, 0, 1) * vis;
  }
  // Two labels on the same side never sit on top of each other: going down the road each one
  // slides below the one before it, then anything that ran past the bottom is pushed back up.
  if (!L.lh) L.lh = Math.max(...cars.map(c => c.lh = c.els.left.el.offsetHeight)) + 6;
  for (const key of ['oL', 'oR']) {
    const col = cars.filter(c => c[key] > .5).sort((a, b) => a.by - b.by);
    let edge = -1e9;
    for (const c of col) { c.push = Math.max(0, edge - c.by); edge = c.by + c.push + L.lh; }
    edge = L.bottom + 22;
    for (let k = col.length - 1; k >= 0; k--) { const c = col[k]; c.push = Math.min(c.push, edge - L.lh - c.by); edge = c.by + c.push; }
  }
  for (const c of cars) {
    const l = c.els.left, r = c.els.right;
    if (!c.on) { if (c.cache.vis !== 0) { c.cache.vis = 0; l.el.style.opacity = r.el.style.opacity = 0; } continue; }
    c.cache.vis = 1;
    c.ly = lerp(c.ly || 0, c.push || 0, .18);
    const y = (c.by - 1 + c.ly).toFixed(1);
    l.el.style.opacity = c.oL.toFixed(2); r.el.style.opacity = c.oR.toFixed(2);
    l.el.style.transform = `translate(${(L.cx - L.edge - L.lw).toFixed(1)}px,${y}px)`;
    r.el.style.transform = `translate(${(L.cx + L.edge).toFixed(1)}px,${y}px)`;
    l.r3.style.opacity = r.r3.style.opacity = noteO;
  }
}

/* ---------- main loop ---------- */
function frame(now) {
  const t = now / 1000, dt = Math.min(.05, Math.max(.001, t - last)); last = t;
  stepReplay(dt);
  stepAnim(now);
  const step = TUNING.speed * (reduced ? .35 : 1) * intro.speedF * dt;
  scroll += step; world += step / L.S;
  updateCars(t, dt);
  draw(t);
  updateLabels();
  syncTimelineUI();
  requestAnimationFrame(frame);
}

// Page load: no lights, no launch. The field is already racing in the latest standings.
layout();
for (let n = 0; n < 90; n++) updateCars(0, .05);        // let the cars find their lanes before the first frame
for (const c of cars) c.side = c.lane;
addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { L.lh = 0; });
document.body.classList.add('live');
last = performance.now() / 1000;
requestAnimationFrame(frame);

// A handle for the console: fastestLab.goTo(0), fastestLab.play(), fastestLab.plan(), fastestLab.idx = 1.5,
// fastestLab.setCars('gt'), fastestLab.world += 5000 (skip ahead along the lap, in car units)
window.fastestLab = {
  goTo, play, cars, snaps, labs, PLAYBACK, TUNING, problems, setCars: setCarStyle,
  plan() { const p = buildPlan(); console.table(p.steps.map((s, i) => ({ to: snaps[i + 1].date, move: +s.move.toFixed(2), hold: +s.hold.toFixed(2) }))); return p; },
  get idx() { return tl.idx; }, set idx(v) { cancelReplay(); tl.anim = null; tl.idx = clamp(+v || 0, 0, LAST); },
  get replaying() { return replay.on; }, get layout() { return L; }, get intro() { return intro; },
  get carStyle() { return carStyle; }, get world() { return world; }, set world(v) { setWorld(v); },
};
})();
</script>
</body>
</html>
