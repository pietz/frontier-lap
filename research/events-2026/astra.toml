# Left out:
# Mythos Preview was limited to partners.
# DeepSeek V4 Pro scored about 52, behind Grok 4.3 and Kimi K2.6.
# Gemini 3.5 Flash improved speed but left Google third.
# Opus 5 strengthened a lineup that already led with Fable.
# Grok 4.6 improved third-place contention in August, reflected in the September grid.
# Carbon’s October preview was restricted to partners.
# Gemini 4 Neon narrowed third by roughly one point on November 18.
# Muse Ember scored below Wonder Full and left Meta fourth.
