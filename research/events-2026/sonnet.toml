# Left out:
# Kimi K2.5 (Jan 27): fourth in the Feb 5 caption era; no change to the order.
# Grok 4.20 (Feb): small refresh, 48; folded into the Feb 19 ranking.
# Kimi K2.6 (Apr 20) and Grok 4.3 (Apr 17): both in the Apr 23 step's fourth/fifth slots, no step of their own.
# Claude Mythos Preview (Apr 7): partners-only (Project Glasswing), noted in the Apr 8 caption only.
# Opus 4.7 (Apr 16): 57, level with Gemini and GPT-5.4; GPT-5.5 a week later is the real shift.
# DeepSeek V4 Pro and Flash (late April): 52 and 47 on v4.0, behind Kimi K2.6 and Grok 4.3; later V4 checkpoints (0731, 0813, 1017) score 33-36 on v4.3 or 50-53 on older versions. Never in the top five in 2026.
# Gemini 3.5 Flash (Google I/O, May): fast, but no Pro, no new gap.
# Index v4.1 (Jun 15) and v4.2/v4.3 (Sep 4-7): re-rates that moved scores, folded into the Jul 9 and Sep 3 steps.
# Fable 5 restored (Jul 1): folded into the Jul 9 caption; the step would have shown a guessed field.
# Opus 5 (Jul 24), Muse Spark 1.1 and 1.2 (Jul-Aug), Grok 4.6 (Aug 12): between steps, no change to the order.
# Fable 5.1 (Sep 1) and Muse Spark 1.3 (Sep 2): two days before Astra; folded into the Sep 3 step.
# Sonnet 5.5 (Sep 28), Gemini 4 Carbon announcement (Oct 28): same lab as the leader, or not yet usable.
# Grok 5: still unreleased on Nov 20 (announced in training in January); a geotoolbox page claiming a launch is wrong.
# DeepSeek V4.1 Flash (Oct 17): 33 on v4.3, no effect.
