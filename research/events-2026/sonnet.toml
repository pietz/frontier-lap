# Take: Anthropic leads almost all year (Claude Code in Feb-Mar, Fable and Opus from June). OpenAI takes pole twice (Apr, briefly) and is the steady second; Google is the volatile one (Gemini 3.1 Pro tops the index, then no Pro for months); Meta, Moonshot and SpaceX AI rotate through fourth and fifth. DeepSeek never makes the top five in 2026.
# Gaps follow index points at roughly 0.22 s per point for the first five points, flatter beyond, adjusted by practice (Claude Code, API access, partners-only). They are wider than merged.txt in the late-year steps because Artificial Analysis scores there are 5 to 15 points apart.
# Most scores come from aggregators quoting Artificial Analysis; where I could only confirm them second-hand, the `why` line says so. Index versions: v4.0 (Jan 7), v4.1 (Jun 15), v4.2/v4.3 (Sep 4-7), v5 (Oct 27).

