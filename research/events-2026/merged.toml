# 2026 merged from sol.toml, astra.toml and sonnet.toml.
# Rules (as in research/ranking-review/MERGED.md): an event is kept when two of the three have it;
# the order is the one two of them give; each gap is the middle value of the three (mean of two
# where only two have the event), rounded to 0.05 and nudged where needed to keep the majority order.
# Owner decision carried over: Anthropic leads from December 2025, so it starts 2026 in front.
# Sources and reasoning for each step are in the three source files.

